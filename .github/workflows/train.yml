name: Train forecast model

# Builds a year of labelled market headlines, trains the forecast model, tests it on unseen months,
# and saves it to model/ (the robot uses it from the next round). Runs every Sunday so it keeps learning.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick test run (3 topics, 3 weeks)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write
  actions: read

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt
      - name: Cache language models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-minilm-v1
      - name: Install
        run: pip install -q -r scripts/ml/requirements.txt
      - name: Reuse the last run's headlines (so only new news has to be downloaded)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/ml
          id=$(gh run list --workflow train.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] && gh run download "$id" -n dataset -D prev && mv prev/dataset.pkl.gz data/ml/previous.pkl.gz && echo "Reusing run $id"
      - name: Build the dataset (a year of headlines and prices)
        env:
          ML_QUICK: ${{ inputs.quick && '1' || '0' }}
        run: mkdir -p out && python scripts/ml/build_dataset.py 2>&1 | tee out/dataset.log; test ${PIPESTATUS[0]} -eq 0
      - name: Keep the dataset (for checking)
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: data/ml/dataset.pkl.gz
          retention-days: 14
      - name: Train and test
        run: python scripts/ml/train.py 2>&1 | tee out/train.log; test ${PIPESTATUS[0]} -eq 0
      - name: Train and test the calendar model
        run: python scripts/ml/cal_model.py train 2>&1 | tee out/calendar.log; test ${PIPESTATUS[0]} -eq 0
      - name: Save the model
        if: ${{ !inputs.quick }}
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/forecast.joblib model/report.json model/calendar.joblib model/calendar_report.json
          git commit -m "Retrained forecast model" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Publish the logs and report (for checking)
        if: always()
        run: |
          mkdir -p out && cp model/report.json model/calendar_report.json out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b ml-check
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Training logs" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ml-check
