name: AI check

# Checks the free GitHub Models AI from the robot (results on the "ai-check" branch)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/ai-trigger.txt"]

permissions:
  contents: write
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyse two live stories
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p out live && git fetch -q --depth=1 origin live && git show FETCH_HEAD:news.json > live/news4.json && git show FETCH_HEAD:charts.json > live/charts.json
          node tools/aidebug.mjs > out/aidebug.txt 2>&1 || true
          curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":10}' > out/curl.txt 2>&1 || true
          node tools/aitest.mjs "$PWD/live" > out/aitest.txt 2>&1 || true
      - name: Publish
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b ai-check
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "AI check" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ai-check
