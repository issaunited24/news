name: AI check

# Checks the free GitHub Models AI from the robot (results on the "ai-check" branch)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/ai-trigger.txt"]

permissions:
  contents: write
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Local AI model test
        run: |
          mkdir -p out
          (getent hosts models.github.ai; nproc; free -g) > out/env.txt 2>&1
          t0=$(date +%s)
          pip install -q llama-cpp-python==0.3.9 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu > out/pip.txt 2>&1; echo "pip $? $(( $(date +%s) - t0 ))s" >> out/env.txt
          pip install -q huggingface_hub >> out/pip.txt 2>&1
          t0=$(date +%s)
          python -c "from huggingface_hub import hf_hub_download as d; print(d('Qwen/Qwen2.5-7B-Instruct-GGUF','qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf')); print(d('Qwen/Qwen2.5-7B-Instruct-GGUF','qwen2.5-7b-instruct-q4_k_m-00002-of-00002.gguf'))" >> out/env.txt 2>&1
          echo "download $(( $(date +%s) - t0 ))s" >> out/env.txt
          python tools/llmtest.py >> out/env.txt 2>&1 || true
      - name: Publish
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b ai-check
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "AI check" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ai-check
