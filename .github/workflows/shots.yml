name: Screenshots

# Phone-sized screenshots of the live app, saved to the "photo-check" branch (for checking real photos)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/shots.mjs", "tools/shots-trigger.txt"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take screenshots
        run: |
          sleep 240   # give the website time to publish the latest version
          mkdir -p out && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
          node tools/shots.mjs
      - name: Publish
        run: |
          cd out && git init -q && git checkout -q -b photo-check
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Screenshots" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-check
