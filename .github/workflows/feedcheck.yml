name: Feed check

# Tests the meaning-based duplicate merging on the robot's real headlines (results on the "feed-check" branch)
on:
  workflow_dispatch:
  push:
    branches: [main, feed-preview]
    paths: ["tools/feed-trigger.txt"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt
      - name: Cache language models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-minilm-v1
      - run: pip install -q -r scripts/ml/requirements.txt
      - name: Check
        run: |
          mkdir -p out && git fetch -q --depth=1 origin live && git show FETCH_HEAD:state.json > /tmp/state.json
          node tools/mergepreview.mjs /tmp/state.json > out/merges.txt 2> out/err.txt || true
      - name: Publish
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b feed-check
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Feed check" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed-check
