name: Check photos

# Downloads the candidate photos in tools/photos.txt and makes labelled contact sheets on the "photo-check" branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/photos.txt"]

permissions:
  contents: write

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and make contact sheets
        run: |
          command -v montage || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)
          mkdir -p out img
          grep -v '^#' tools/photos.txt | while read -r label id; do
            [ -z "$id" ] && continue
            # whole photo (not cropped), with yellow lines at every 10% so a focus point can be read off
            echo "get $label"
            if timeout 30 curl -sfL --max-time 25 "https://images.unsplash.com/photo-$id?auto=format&q=60&w=420&fm=jpg" -o "img/$label.jpg" </dev/null; then
              timeout 30 convert "img/$label.jpg" -fill none -stroke 'rgba(255,230,0,0.55)' -strokewidth 1 \
                -draw "$(identify -format '%w %h' "img/$label.jpg" | awk '{for(i=1;i<10;i++){x=$1*i/10;y=$2*i/10;printf "line %d,0 %d,%d line 0,%d %d,%d ",x,x,$2,y,$1,y}}')" "img/$label.jpg" </dev/null
              echo "ok $label $(identify -format '%wx%h' "img/$label.jpg")" | tee -a out/sizes.txt
            else echo "MISSING $label $id" | tee -a out/missing.txt; fi
          done
          ls img/*.jpg | split -l 12 - list_
          n=0; for f in list_*; do n=$((n+1)); montage $(cat $f) -tile 3x -geometry 400x400+6+6 -background '#111' -fill white -pointsize 18 -set label '%t' "out/sheet$n.jpg"; done
          touch out/missing.txt
      - name: Publish sheets
        run: |
          cd out
          git init -q && git checkout -q -b photo-check
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Photo contact sheets"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-check
