name: AI analyst

# Five AI workers run next to the news robot. Each runs a free open AI model (Qwen2.5 14B Instruct) on its own GitHub
# machine, analyses important market stories and publishes the results to its branch (ai-0 ... ai-4); the news
# robot blends them into the calls. One run keeps going for about 2 hours; the schedule starts the next one.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/analyst.yml"]

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      group: analyst-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ai/requirements.txt
      - name: Install the AI engine
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
        run: pip install -q -r scripts/ai/requirements.txt || pip install -q "llama-cpp-python[server]==0.3.9" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Download the AI model
        run: |
          for i in 1 2 3; do python -c "from huggingface_hub import snapshot_download as d; d('Qwen/Qwen2.5-14B-Instruct-GGUF', allow_patterns=['*q4_k_m*'], local_dir='model')" && break; sleep 30; done
          ls -la model
      - name: Analyse stories
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 5
          MINUTES: 110
        run: |
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          M=$(ls model/*q4_k_m*.gguf | sort | head -1); echo "model file: $M"
          python -m llama_cpp.server --model "$M" --n_ctx 6144 --n_threads 4 --n_batch 512 --cache True --cache_type ram --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 150); do curl -sf http://127.0.0.1:8000/v1/models >/dev/null && break; sleep 2; done
          (python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"; curl -s http://127.0.0.1:8000/v1/models | head -c 200; echo; tail -5 server.log) > engine.txt 2>&1
          node scripts/analyst-run.mjs
      - name: Server log (for checking)
        if: always()
        run: tail -20 server.log || true
