name: Collect news

# One run keeps collecting every ~3.5 minutes for about 2 hours (scripts/loop.sh).
# The schedule below is only a safety net: if no run is going, it starts one.
# While a run is going, the next one waits in line and starts the moment it finishes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:            # lets you start it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/collect.yml", "scripts/loop.sh"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt
      - name: Cache language models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-minilm-v1
      - name: Install the forecast model's tools
        continue-on-error: true   # if this fails, the robot still runs and uses the forex rules
        run: pip install -q -r scripts/ml/requirements.txt
      - name: Download the forecast models
        continue-on-error: true   # without them the robot uses the forex rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p model && gh release download model -D model --clobber && ls -la model
      - name: Collect and rank news, every few minutes
        run: |
          cp scripts/loop.sh "$RUNNER_TEMP/loop.sh"
          bash "$RUNNER_TEMP/loop.sh"
