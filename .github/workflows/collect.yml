name: Collect news

on:
  schedule:
    - cron: "3-59/10 * * * *"   # about every 10 minutes (GitHub may run it a little late)
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["feeds.json", "scripts/**", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and rank news
        run: node scripts/collect.mjs
      - name: Save the latest news
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update news" -q
          for i in 1 2 3; do
            git pull --rebase -q -X ours origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
