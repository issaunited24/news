name: Collect news

# One run keeps collecting every ~3.5 minutes for about 2 hours (scripts/loop.sh).
# The schedule below is only a safety net: if no run is going, it starts one.
# While a run is going, the next one waits in line and starts the moment it finishes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:            # lets you start it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/collect.yml", "scripts/loop.sh"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and rank news, every few minutes
        run: |
          cp scripts/loop.sh "$RUNNER_TEMP/loop.sh"
          bash "$RUNNER_TEMP/loop.sh"
