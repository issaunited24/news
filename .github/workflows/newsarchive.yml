name: Archive news for training

# Every 6 hours: adds the robot's market headlines to the "newsarchive" branch (the models learn from them).
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Update the archive
        run: |
          mkdir -p arch
          if git fetch -q --depth=1 origin newsarchive; then git --work-tree=arch checkout FETCH_HEAD -- . && git reset -q; fi
          python3 scripts/ml/archive_news.py arch
          cd arch && rm -rf .git && git init -q && git checkout -q -b newsarchive
          git config user.name "briefly-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "News archive $(date -u +%F\ %H:%M)" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" newsarchive
