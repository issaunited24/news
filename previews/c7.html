<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d26">
<title>Briefly · Prism</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Fira+Code:wght@500;600&display=swap">
<style>
/* Prism: liquid light. Slow colour fields drift behind thick frosted glass; the category photo sits inside a lens. */
:root {
  --bg: #0b0d26; --ink: #f7f8ff; --ink2: #cfd3f0; --mute: #9298bf; --faint: #5c628c;
  --p1: 77,225,255; --p2: 255,92,200; --p3: 120,100,255;
  --ui: Urbanist, system-ui, sans-serif; --mono: "Fira Code", ui-monospace, monospace;
  --up: #43f0b2; --down: #ff6489;
  color-scheme: dark;
}
body[data-view=top] { --p1: 77,225,255; --p2: 255,92,200; --p3: 120,100,255; }
body[data-view=world] { --p1: 255,170,80; --p2: 255,90,120; --p3: 90,120,255; }
body[data-view=us] { --p1: 90,140,255; --p2: 255,80,110; --p3: 200,210,255; }
body[data-view=forex] { --p1: 255,200,87; --p2: 56,245,195; --p3: 77,160,255; }
body[data-view=tech] { --p1: 150,110,255; --p2: 77,225,255; --p3: 255,92,200; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.field { position: fixed; inset: -10%; z-index: 0; pointer-events: none; filter: blur(70px) saturate(1.2); opacity: .55; }
.field i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; transition: background 1.4s; }
.field i:nth-child(1) { left: -15vmax; top: -10vmax; background: rgba(var(--p1),.55); animation: d1 22s ease-in-out infinite alternate; }
.field i:nth-child(2) { right: -20vmax; top: 30vh; background: rgba(var(--p2),.45); animation: d2 26s ease-in-out infinite alternate; }
.field i:nth-child(3) { left: 10vw; bottom: -30vmax; background: rgba(var(--p3),.5); animation: d1 30s ease-in-out infinite alternate-reverse; }
@keyframes d1 { to { transform: translate3d(14vw, 10vh, 0) scale(1.15); } } @keyframes d2 { to { transform: translate3d(-12vw, -8vh, 0) scale(.9); } }
.veil { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, rgba(11,13,38,.35), rgba(11,13,38,.75) 60%, rgba(11,13,38,.92)); }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

.top { display: flex; align-items: center; padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 0; }
.logo { font: 800 21px var(--ui); letter-spacing: -.03em; }
.logo i { font-style: normal; background: linear-gradient(90deg, rgb(var(--p1)), rgb(var(--p2)), rgb(var(--p3))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.q { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.q svg { width: 16px; height: 16px; }

.intro { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 132px; align-items: center; gap: 12px; padding: 18px 18px 10px; }
.intro h1 { margin: 0; font: 800 40px/.95 var(--ui); letter-spacing: -.04em; }
.intro p { margin: 8px 0 0; font-size: 13px; color: var(--ink2); }
.lens { position: relative; width: 132px; height: 132px; border-radius: 50%; overflow: hidden; background: #191c44; animation: focus 1s cubic-bezier(.2,.8,.2,1) both;
  box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 0 0 7px rgba(255,255,255,.04), 0 0 50px -6px rgba(var(--p1),.7), 0 0 90px -20px rgba(var(--p2),.7); }
.lens img { width: 100%; height: 100%; object-fit: cover; }
.lens::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(60% 50% at 30% 22%, rgba(255,255,255,.4), transparent 60%), linear-gradient(200deg, transparent 50%, rgba(var(--p2),.35)); }
@keyframes focus { from { opacity: 0; transform: scale(.7) rotate(-10deg); filter: blur(8px); } }

.tabs { position: sticky; top: 0; z-index: 10; margin: 0 12px; padding: calc(env(safe-area-inset-top,0px) + 8px) 0 8px; }
.tabs .rail { position: relative; display: flex; padding: 5px; border-radius: 20px; overflow-x: auto; scrollbar-width: none;
  background: rgba(255,255,255,.08); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.18), 0 14px 30px -14px rgba(0,0,0,.7); }
.tabs .rail::-webkit-scrollbar { display: none; }
.tab { position: relative; flex: 1 0 auto; z-index: 1; padding: 9px 12px; border-radius: 15px; font: 700 13px var(--ui); color: var(--mute); white-space: nowrap; transition: color .3s; }
.tab[aria-selected="true"] { color: #0b0d26; }
.blob { position: absolute; z-index: 0; top: 5px; bottom: 5px; border-radius: 15px; background: linear-gradient(100deg, rgb(var(--p1)), rgb(var(--p2))); box-shadow: 0 6px 20px -6px rgba(var(--p2),.8); transition: left .45s cubic-bezier(.3,1.3,.5,1), width .45s cubic-bezier(.3,1.3,.5,1), background 1s; }

/* glass tiles with round lens thumbnails */
.list { display: flex; flex-direction: column; gap: 10px; padding: 8px 12px 70px; }
.tile { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px 12px 12px; border-radius: 26px; animation: drop .6s cubic-bezier(.2,.8,.2,1) both;
  background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 1px 0 rgba(255,255,255,.16), 0 18px 34px -24px rgba(0,0,0,.9); }
.tile .im { position: relative; width: 80px; height: 80px; border-radius: 50%; padding: 2px; background: conic-gradient(from 200deg, rgb(var(--p1)), rgb(var(--p2)), rgb(var(--p3)), rgb(var(--p1))); }
.tile .im img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #191c44; display: block; border: 2px solid #12142e; }
@keyframes drop { from { opacity: 0; transform: translateY(14px) scale(.98); filter: blur(4px); } }
.meta { display: flex; align-items: center; gap: 7px; font: 600 11px var(--ui); color: var(--mute); min-width: 0; }
.meta .o { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h { margin: 3px 0 0; font: 700 16px/1.26 var(--ui); letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum { margin: 3px 0 0; font: 500 12.5px/1.4 var(--ui); color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live { font: 800 9.5px var(--ui); letter-spacing: .1em; padding: 2px 7px; border-radius: 999px; color: #fff; background: linear-gradient(90deg, #ff3d6a, #ff7a4d); }
.feat { position: relative; display: block; height: 280px; border-radius: 30px; overflow: hidden; animation: drop .6s both; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 30px 50px -30px #000; }
.feat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.feat .gl { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 14px 16px; border-radius: 22px; background: rgba(15,18,48,.5); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), inset 0 1px 0 rgba(255,255,255,.2); }
.feat .h { font-size: 19px; }

/* Forex: one big prism with all three markets */
.prism { margin: 8px 12px 0; padding: 14px; border-radius: 30px; animation: drop .6s both;
  background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.2), 0 0 50px -16px rgba(var(--p1),.5), 0 30px 50px -30px #000; }
.pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pk { padding: 9px 10px; border-radius: 18px; text-align: left; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: .3s; }
.pk .n { font: 700 11px var(--ui); color: var(--mute); } .pk .v { font: 800 15px var(--ui); font-variant-numeric: tabular-nums; } .pk .c { font: 600 10px var(--mono); color: var(--up); } .pk .c.dn { color: var(--down); }
.pk[aria-pressed="true"] { background: rgba(var(--c),.16); box-shadow: inset 0 0 0 1px rgba(var(--c),.6), 0 0 22px -6px rgba(var(--c),.8); } .pk[aria-pressed="true"] .n { color: rgb(var(--c)); }
.stage { position: relative; display: block; width: 100%; margin-top: 12px; text-align: left; }
.stage .big { font: 800 36px/1 var(--ui); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.stage .sub { margin-top: 4px; font: 600 11.5px var(--mono); color: var(--mute); }
.stage svg { display: block; width: 100%; height: 120px; margin-top: 6px; }
.stage .go { position: absolute; right: 0; top: 2px; font: 700 11px var(--ui); padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.lights { display: flex; gap: 6px; margin: 10px 12px 0; }
.lights span { flex: 1; text-align: center; padding: 7px 0; border-radius: 14px; font: 700 11px var(--ui); color: var(--faint); background: rgba(255,255,255,.04); }
.lights span.on { color: #07261d; background: rgb(56,245,195); box-shadow: 0 0 16px -2px rgba(56,245,195,.8); }
/* Forex news: prismatic neon edge */
.fx { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: 26px; animation: drop .6s both;
  background: radial-gradient(100% 120% at 0% 0%, rgba(var(--g),.18), transparent 55%), linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  box-shadow: inset 0 0 0 1.5px rgba(var(--g),.6), 0 0 24px -4px rgba(var(--g),.7), 0 0 70px -20px rgba(var(--g),.6); }
.fx.pulse { animation: drop .6s both, shimmer 3s ease-in-out infinite; }
@keyframes shimmer { 50% { box-shadow: inset 0 0 0 1.5px rgba(var(--g),.95), 0 0 34px -2px rgba(var(--g),.9), 0 0 90px -16px rgba(var(--g),.8); } }
.gauge { display: flex; flex-direction: column; gap: 5px; padding: 8px; border-radius: 18px; background: rgba(8,10,30,.6); align-self: start; }
.gauge div { display: grid; grid-template-columns: 1fr auto; font: 600 8.5px var(--mono); color: var(--mute); }
.gauge svg { grid-column: 1 / -1; width: 100%; height: 15px; }
.lvl { font: 800 10px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--g)); text-shadow: 0 0 12px rgba(var(--g),.9); }

/* chart: liquid glass sheet */
#chartPanel { position: fixed; inset: 0; z-index: 40; }
.ch-scrim { position: absolute; inset: 0; background: rgba(8,10,30,.4); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); opacity: 0; transition: opacity .4s; }
.ch { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom,0px)); max-width: 540px; margin: 0 auto; padding: 14px 16px 14px; border-radius: 34px;
  background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05)), rgba(20,22,58,.75); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 0 rgba(255,255,255,.3), 0 0 60px -16px rgba(var(--p1),.6), 0 40px 60px -20px #000;
  clip-path: inset(100% 0 0 0 round 34px); transition: clip-path .6s cubic-bezier(.2,.9,.2,1); }
#chartPanel.open .ch-scrim { opacity: 1; } #chartPanel.open .ch { clip-path: inset(0 0 0 0 round 34px); }
.ch-head { display: flex; align-items: center; gap: 10px; }
.ch-assets { display: flex; gap: 6px; }
.ch-assets button { padding: 7px 12px; border-radius: 999px; font: 700 12px var(--ui); color: var(--mute); background: rgba(255,255,255,.06); }
.ch-assets button[aria-pressed="true"] { color: #0b0d26; background: linear-gradient(100deg, rgb(var(--p1)), rgb(var(--p2))); }
.ch-x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); }
.ch-name { margin-top: 14px; font: 700 13px var(--ui); color: var(--ink2); } .ch-name span + span { color: var(--mute); font: 500 11px var(--mono); margin-left: 6px; }
.ch-price { font: 800 40px/1.05 var(--ui); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ch-chg { font: 600 12px var(--mono); color: var(--up); } .ch-chg.dn { color: var(--down); } .ch-chg span { color: var(--mute); margin-left: 4px; } .ch-chg .ch-time { color: var(--ink2); margin: 0; }
[data-k=chart] { height: 220px; margin: 10px -4px 8px; }
.ch-msg { display: grid; place-items: center; height: 100%; color: var(--mute); font-size: 13px; }
.ch-bot { display: grid; grid-template-columns: 1fr; gap: 6px; }
.ch-ranges, .ch-types { display: grid; padding: 4px; border-radius: 18px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.ch-ranges { grid-template-columns: repeat(6, 1fr); } .ch-types { grid-template-columns: repeat(4, 1fr); }
.ch-ranges button, .ch-types button { height: 32px; border-radius: 14px; font: 700 12px var(--ui); color: var(--mute); transition: .25s; }
.ch-ranges button[aria-pressed="true"], .ch-types button[aria-pressed="true"] { color: var(--ink); background: rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 14px -4px rgba(0,0,0,.5); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div><div class="veil" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<div id="chartPanel" hidden></div>
<script src="kit.js"></script>
<script>
const { esc, ago } = Kit;
const GLOW = { red: '255,70,110', gold: '255,196,72', cyan: '77,225,255' };
const MK = { gold: '255,200,87', usd: '77,225,255', ndq: '255,92,200' };
const SUB = { top: 'What the whole world is watching.', world: 'Everything beyond the U.S.', us: 'Politics, culture and the feed.', forex: 'What moves gold, the dollar and the Nasdaq.', tech: 'Models, chips and the frontier.' };
let pick = 'gold';
function tile(s, i) {
  const t = Kit.thumb(s, Kit.catOf(s), 220);
  return `<a class="tile" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 8) * 45}ms"><div class="im">${Kit.img(t, '')}</div>
    <div style="min-width:0"><div class="meta">${s.breaking ? '<span class="live">LIVE</span>' : ''}<span class="o">${esc(s.outlet)}</span><span>· ${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.summary ? `<p class="sum">${esc(s.summary)}</p>` : ''}</div></a>`;
}
function fx(s, i) {
  const lv = Kit.level(s), fc = Kit.forecasts(s.fx, { w: 72, h: 15 });
  return `<a class="fx ${lv.k === 'red' ? 'pulse' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="--g:${GLOW[lv.k]};animation-delay:${Math.min(i, 8) * 45}ms">
    <div class="gauge">${fc.map(f => `<div><span>${f.label}</span><span style="color:${f.color}">${f.dir === 'up' ? '▲' : f.dir === 'down' ? '▼' : '–'} ${f.conf || ''}</span>${f.svg}</div>`).join('')}</div>
    <div style="min-width:0"><div class="meta"><span class="lvl">${lv.tag}</span><span class="o">${esc(s.outlet)}</span><span>· ${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.fx?.why ? `<p class="sum">${esc(s.fx.why)}</p>` : ''}</div></a>`;
}
function prism() {
  const picks = ['gold', 'usd', 'ndq'].map(k => {
    const m = Kit.series(k, '1W'), up = (m.chg ?? 0) >= 0;
    return `<button class="pk" data-pick="${k}" aria-pressed="${k === pick}" style="--c:${MK[k]}"><div class="n">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar' : 'Nasdaq'}</div><div class="v">${Kit.price(k, m.last)}</div><div class="c ${up ? '' : 'dn'}">${m.chg == null ? '—' : `${up ? '+' : ''}${m.chg.toFixed(2)}%`}</div></button>`;
  }).join('');
  const m = Kit.series(pick, '1W'), up = (m.chg ?? 0) >= 0;
  const now = new Date();
  const ses = [['Sydney', 'Australia/Sydney', 7, 16], ['Tokyo', 'Asia/Tokyo', 9, 18], ['London', 'Europe/London', 8, 17], ['New York', 'America/New_York', 8, 17]];
  return `<section class="prism" id="prism"><div class="pick">${picks}</div>
    <button class="stage" data-chart="${pick}" style="--c:${MK[pick]}"><span class="go">Chart ↗</span><div class="big">${Kit.price(pick, m.last)}</div><div class="sub">${Kit.ASSETS[pick].name} · <span style="color:${up ? 'var(--up)' : 'var(--down)'}">${m.chg == null ? '—' : `${up ? '+' : ''}${m.chg.toFixed(2)}%`}</span> this week</div>
    ${Kit.spark(m.pts, { w: 320, h: 120, color: `rgb(${MK[pick]})`, n: 80, stroke: 2.4, glow: 3.2, fillOpacity: .5, padX: 0 })}</button></section>
    <div class="lights">${ses.map(([n, tz, o, c]) => { const h = +new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', hourCycle: 'h23' }).format(now); return `<span class="${h >= o && h < c ? 'on' : ''}">${n}</span>`; }).join('')}</div>`;
}
function moveBlob() {
  const b = document.querySelector('.blob'), t = document.querySelector('.tab[aria-selected="true"]');
  if (b && t) { b.style.left = t.offsetLeft + 'px'; b.style.width = t.offsetWidth + 'px'; }
}
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pick]'); if (!p) return;
  pick = p.dataset.pick; const el = document.getElementById('prism'); el.outerHTML = prism().replace(/<div class="lights">[\s\S]*$/, '');
});
addEventListener('resize', moveBlob);
Kit.start({
  shell: () => `<div class="top"><span class="logo">Brief<i>ly</i></span><span class="q" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span></div>
    <section class="intro" id="intro"></section>
    <nav class="tabs"><div class="rail"><span class="blob"></span>${Kit.TABS.map(t => `<button class="tab" data-tab="${t.id}">${t.name}</button>`).join('')}</div></nav><main id="feedArea"></main>`,
  renderTab(tab, list) {
    document.getElementById('intro').innerHTML = `<div><h1>${Kit.catName(tab)}</h1><p>${SUB[tab]} ${list.length} stories.</p></div><div class="lens"><img src="${Kit.photo(tab, 400, 1)}" alt=""></div>`;
    requestAnimationFrame(moveBlob);
    const area = document.getElementById('feedArea');
    if (tab === 'forex') { area.innerHTML = prism() + `<div class="list" style="padding-top:12px">${list.map((s, i) => s.fx ? fx(s, i) : tile(s, i)).join('')}</div>`; return; }
    if (tab === 'top' && list.length) {
      const [f, ...rest] = list, t = Kit.thumb(f, Kit.catOf(f), 1000);
      area.innerHTML = `<div class="list"><a class="feat" href="${esc(f.link)}" target="_blank" rel="noopener">${Kit.img(t, '')}<div class="gl"><div class="meta">${f.breaking ? '<span class="live">LIVE</span>' : ''}<span class="o">${esc(f.outlet)}</span><span>· ${ago(f.published)}</span></div><h3 class="h">${esc(f.title)}</h3></div></a>${rest.map(tile).join('')}</div>`;
      return;
    }
    area.innerHTML = `<div class="list">${list.map(tile).join('')}</div>`;
  },
  chartShell: () => `<div class="ch-scrim"></div><section class="ch" role="dialog" aria-label="Chart">
    <div class="ch-head"><div class="ch-assets">${Object.entries(Kit.ASSETS).map(([k]) => `<button data-asset="${k}">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar' : 'Nasdaq'}</button>`).join('')}</div><button class="ch-x" data-close aria-label="Close">✕</button></div>
    <div class="ch-name"><span data-k="name"></span><span data-k="sym"></span></div>
    <div class="ch-price" data-k="price"></div><div class="ch-chg" data-k="chg"></div>
    <div data-k="chart"></div>
    <div class="ch-bot"><div class="ch-ranges">${Kit.RANGES.map(r => `<button data-range="${r}">${r}</button>`).join('')}</div>
    <div class="ch-types">${Kit.TYPES.map(([k, n]) => `<button data-type="${k}">${n}</button>`).join('')}</div></div></section>`,
