<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a1f">
<title>Briefly · Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Reel: the news plays. A side rail instead of tabs, the top stories play like a story reel, and the chart drops down from the top. */
:root {
  --bg: #0c0a1f; --ink: #fbf8ff; --ink2: #d3cfe6; --mute: #958fb3; --faint: #5a5480;
  --em: 255,94,58; --am: 255,176,72;
  --disp: Syne, system-ui, sans-serif; --ui: Inter, system-ui, sans-serif; --mono: "Martian Mono", ui-monospace, monospace;
  --up: #47f0b1; --down: #ff5f86; --rail: 56px;
  color-scheme: dark;
}
body[data-view=world] { --em: 255,140,60; } body[data-view=us] { --em: 110,130,255; --am: 255,94,110; } body[data-view=forex] { --em: 255,196,70; --am: 60,225,200; } body[data-view=tech] { --em: 170,110,255; --am: 70,210,255; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.amb { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(60% 40% at 100% 0%, rgba(var(--em),.16), transparent 70%), radial-gradient(70% 40% at 20% 100%, rgba(70,50,200,.3), transparent 70%), linear-gradient(180deg, #120e2c, #0c0a1f 60%); transition: background 1s; }

/* the rail */
.rail { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; width: var(--rail); display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top,0px) + 14px) 0 calc(env(safe-area-inset-bottom,0px) + 14px); overflow: hidden;
  background: rgba(10,8,26,.7); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 1px 0 0 rgba(255,255,255,.06); }
.rail .bgp { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: .22; filter: blur(3px) saturate(1.3); transition: background-image .6s; }
.rail .mark { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font: 800 16px var(--disp); color: #140a06; background: linear-gradient(135deg, rgb(var(--am)), rgb(var(--em))); box-shadow: 0 0 18px rgba(var(--em),.7); transition: .8s; }
.rail nav { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.tab { position: relative; writing-mode: vertical-rl; transform: rotate(180deg); padding: 14px 8px; font: 700 13px var(--disp); letter-spacing: .04em; color: var(--mute); white-space: nowrap; transition: color .3s; }
.tab::before { content: ""; position: absolute; right: -10px; top: 18%; bottom: 18%; width: 3px; border-radius: 3px; background: rgb(var(--em)); box-shadow: 0 0 12px rgb(var(--em)); transform: scaleY(0); transition: transform .35s cubic-bezier(.3,1.3,.5,1), background .8s; }
.tab[aria-selected="true"] { color: var(--ink); } .tab[aria-selected="true"]::before { transform: none; }
.rail .clk { font: 400 9px var(--mono); color: var(--mute); writing-mode: vertical-rl; transform: rotate(180deg); }

.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-left: var(--rail); }
.head { display: flex; align-items: flex-end; gap: 10px; padding: calc(env(safe-area-inset-top,0px) + 16px) 16px 12px; }
.head h1 { margin: 0; font: 800 30px/1 var(--disp); letter-spacing: -.03em; }
.head h1 span { color: rgb(var(--em)); transition: color .8s; }
.head small { margin-left: auto; font: 400 10px var(--mono); color: var(--mute); padding-bottom: 4px; }

/* the reel */
.reel { position: relative; margin: 0 12px; height: min(62vh, 520px); border-radius: 28px; overflow: hidden; background: #1a1538; box-shadow: 0 30px 60px -30px rgba(var(--em),.6), inset 0 0 0 1px rgba(255,255,255,.08); touch-action: pan-y; }
.fr { position: absolute; inset: 0; opacity: 0; transition: opacity .6s; pointer-events: none; }
.fr.on { opacity: 1; pointer-events: auto; }
.fr img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); }
.fr.on img.bg { animation: kb 7s linear both; }
@keyframes kb { from { transform: scale(1.12) translate3d(2%, 1%, 0); } to { transform: scale(1.02); } }
.fr::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,10,31,.55), rgba(12,10,31,0) 22%, rgba(12,10,31,.15) 50%, rgba(12,10,31,.95)); }
.fr .cap { position: absolute; z-index: 1; left: 18px; right: 18px; bottom: 18px; }
.fr .cap .k { font: 500 10px var(--mono); color: rgb(var(--am)); text-transform: uppercase; letter-spacing: .08em; }
.fr .cap h2 { margin: 8px 0 0; font: 800 25px/1.08 var(--disp); letter-spacing: -.025em; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.fr .cap p { margin: 8px 0 0; font-size: 13px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fr .cap .rd { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 9px 14px; border-radius: 999px; font: 600 12.5px var(--ui); color: #140a06; background: linear-gradient(90deg, rgb(var(--am)), rgb(var(--em))); box-shadow: 0 8px 20px -6px rgba(var(--em),.8); }
.bars { position: absolute; z-index: 3; left: 12px; right: 12px; top: 12px; display: flex; gap: 4px; }
.bars i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.bars i b { display: block; height: 100%; width: 0; background: #fff; box-shadow: 0 0 6px #fff; }
.bars i.done b { width: 100%; }
.bars i.run b { animation: fill var(--dur) linear forwards; }
@keyframes fill { to { width: 100%; } }
.reel.paused .bars i.run b { animation-play-state: paused; }
.zone { position: absolute; z-index: 2; top: 0; bottom: 120px; width: 35%; }
.zone.l { left: 0; } .zone.r { right: 0; }
/* market frames (Forex reel) */
.fr.mf { background: radial-gradient(90% 70% at 100% 0%, rgba(var(--c),.4), transparent 60%), radial-gradient(80% 60% at 0% 100%, rgba(var(--c),.18), transparent 60%), linear-gradient(170deg, #1d1840, #0f0c26); }
.fr.mf::after { display: none; }
.mf .top { position: absolute; z-index: 1; left: 18px; right: 18px; top: 34px; }
.mf .n { font: 500 11px var(--mono); letter-spacing: .1em; color: rgb(var(--c)); text-transform: uppercase; text-shadow: 0 0 12px rgba(var(--c),.8); }
.mf .p { margin-top: 8px; font: 800 52px/1 var(--disp); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.mf .c { margin-top: 8px; font: 500 12px var(--mono); color: var(--up); } .mf .c.dn { color: var(--down); }
.mf svg { position: absolute; left: 0; right: 0; bottom: 70px; width: 100%; height: 46%; }
.mf .open { position: absolute; z-index: 4; left: 18px; right: 18px; bottom: 16px; height: 44px; border-radius: 16px; font: 600 13.5px var(--ui); color: #120d0a; background: rgb(var(--c)); box-shadow: 0 0 24px -4px rgba(var(--c),.9); }
.mf.on .p { animation: count .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes count { from { opacity: 0; transform: translateY(12px); filter: blur(6px); } }

/* list */
.sec { padding: 22px 16px 10px; font: 700 12px var(--disp); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.list { display: flex; flex-direction: column; padding: 0 12px 60px; }
.card { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,.06); animation: up .5s cubic-bezier(.2,.8,.2,1) both; }
.card .im { width: 74px; height: 98px; border-radius: 14px; overflow: hidden; background: #1a1538; box-shadow: 0 12px 20px -12px #000; }
.card .im img { width: 100%; height: 100%; object-fit: cover; }
@keyframes up { from { opacity: 0; transform: translateY(12px); } }
.meta { display: flex; align-items: center; gap: 7px; font: 400 9.5px var(--mono); color: var(--mute); text-transform: uppercase; letter-spacing: .04em; min-width: 0; }
.meta .o { color: rgb(var(--am)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h { margin: 5px 0 0; font: 700 16px/1.25 var(--ui); letter-spacing: -.015em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum { margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live { color: #fff; background: #ff375f; padding: 1px 5px; border-radius: 4px; }
/* Forex news: neon importance */
.fx { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; margin: 6px 0; padding: 12px; border-radius: 22px; animation: up .5s both;
  background: radial-gradient(90% 120% at 0% 0%, rgba(var(--g),.2), transparent 60%), #15112f; box-shadow: inset 0 0 0 1.5px rgba(var(--g),.55), 0 0 20px -4px rgba(var(--g),.65), 0 0 60px -20px rgba(var(--g),.6); }
.fx.pulse { animation: up .5s both, glow 2.8s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 1.5px rgba(var(--g),.95), 0 0 30px -2px rgba(var(--g),.85), 0 0 80px -16px rgba(var(--g),.75); } }
.vu { display: flex; flex-direction: column; gap: 6px; align-self: start; padding: 8px; border-radius: 14px; background: rgba(5,4,16,.6); }
.vu .r { display: flex; justify-content: space-between; font: 400 8px var(--mono); color: var(--mute); }
.vu svg { width: 100%; height: 14px; display: block; }
.lvl { font: 500 9.5px var(--mono); letter-spacing: .12em; color: rgb(var(--g)); text-shadow: 0 0 10px rgba(var(--g),.9); }

/* chart: drops from the top like a shade */
#chartPanel { position: fixed; inset: 0; z-index: 40; }
.ch-scrim { position: absolute; inset: 0; background: rgba(6,5,16,.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .35s; }
.ch { position: absolute; left: 0; right: 0; top: 0; max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top,0px) + 14px) 16px 12px; border-radius: 0 0 32px 32px;
  background: radial-gradient(80% 60% at 100% 100%, rgba(var(--em),.2), transparent 60%), linear-gradient(180deg, #17123a, #110d2a); box-shadow: 0 30px 60px -10px rgba(0,0,0,.8), inset 0 -1px 0 rgba(var(--em),.5), 0 10px 40px -10px rgba(var(--em),.5);
  transform: translateY(-105%); transition: transform .6s cubic-bezier(.25,1.25,.4,1); }
#chartPanel.open .ch-scrim { opacity: 1; } #chartPanel.open .ch { transform: none; }
.ch-grab { width: 44px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: rgba(255,255,255,.22); }
.ch-top { display: flex; align-items: center; gap: 8px; }
.ch-assets { display: flex; gap: 6px; }
.ch-assets button { padding: 7px 12px; border-radius: 12px; font: 600 12px var(--ui); color: var(--mute); background: rgba(255,255,255,.05); }
.ch-assets button[aria-pressed="true"] { color: #140a06; background: linear-gradient(90deg, rgb(var(--am)), rgb(var(--em))); }
.ch-x { margin-left: auto; width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.07); color: var(--ink2); }
.ch-name { margin-top: 14px; font: 400 10px var(--mono); color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }
.ch-price { margin-top: 2px; font: 800 42px/1 var(--disp); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ch-chg { margin-top: 6px; font: 500 11.5px var(--mono); color: var(--up); } .ch-chg.dn { color: var(--down); } .ch-chg span { color: var(--mute); margin-left: 4px; } .ch-chg .ch-time { color: var(--ink2); margin: 0; }
[data-k=chart] { height: 220px; margin: 10px -4px 6px; }
.ch-msg { display: grid; place-items: center; height: 100%; color: var(--mute); font-size: 13px; }
.ch-ranges { display: grid; grid-template-columns: repeat(6, 1fr); }
.ch-ranges button { position: relative; isolation: isolate; height: 36px; font: 500 11px var(--mono); color: var(--mute); }
.ch-ranges button[aria-pressed="true"] { color: var(--ink); }
.ch-ranges button[aria-pressed="true"]::before { content: ""; position: absolute; inset: 4px 6px; border-radius: 10px; background: rgba(var(--em),.18); box-shadow: inset 0 0 0 1px rgba(var(--em),.6); z-index: -1; }
.ch-types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.ch-types button { height: 34px; border-radius: 12px; font: 600 12px var(--ui); color: var(--mute); background: rgba(255,255,255,.04); }
.ch-types button[aria-pressed="true"] { color: var(--ink); background: rgba(255,255,255,.12); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="amb" aria-hidden="true"></div>
<div id="app"></div>
<div id="chartPanel" hidden></div>
<script src="kit.js"></script>
<script>
const { esc, ago } = Kit;
const GLOW = { red: '255,64,104', gold: '255,190,60', cyan: '70,220,255' };
const MK = { gold: '255,200,87', usd: '70,220,255', ndq: '255,92,200' };
const NAME = { top: ['Top', 'stories'], world: ['The', 'world'], us: ['United', 'States'], forex: ['Your', 'markets'], tech: ['Tech', '& AI'] };
const DUR = 6500;
let timer = null, idx = 0, count = 0;
function card(s, i) {
  const t = Kit.thumb(s, Kit.catOf(s), 220);
  return `<a class="card" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 8) * 40}ms"><div class="im">${Kit.img(t, '')}</div>
    <div style="min-width:0"><div class="meta">${s.breaking ? '<span class="live">live</span>' : ''}<span class="o">${esc(s.outlet)}</span><span>${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.summary ? `<p class="sum">${esc(s.summary)}</p>` : ''}</div></a>`;
}
function fx(s, i) {
  const lv = Kit.level(s), fc = Kit.forecasts(s.fx, { w: 70, h: 14 });
  return `<a class="fx ${lv.k === 'red' ? 'pulse' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="--g:${GLOW[lv.k]};animation-delay:${Math.min(i, 8) * 40}ms">
    <div class="vu">${fc.map(f => `<div><div class="r"><span>${f.label}</span><span style="color:${f.color}">${f.dir === 'up' ? '▲' : f.dir === 'down' ? '▼' : '–'} ${f.conf || ''}</span></div>${f.svg}</div>`).join('')}</div>
    <div style="min-width:0"><div class="meta"><span class="lvl">${lv.tag}</span><span class="o" style="color:var(--ink2)">${esc(s.outlet)}</span><span>${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.fx?.why ? `<p class="sum">${esc(s.fx.why)}</p>` : ''}</div></a>`;
}
function storyFrame(s, i) {
  const t = Kit.thumb(s, Kit.catOf(s), 900);
  return `<div class="fr" data-i="${i}">${Kit.img(t, 'bg')}<div class="cap"><div class="k">${s.breaking ? '● Live · ' : ''}${esc(s.outlet)} · ${ago(s.published)}</div><h2>${esc(s.title)}</h2>${s.summary ? `<p>${esc(s.summary)}</p>` : ''}
    <a class="rd" href="${esc(s.link)}" target="_blank" rel="noopener">Read story →</a></div></div>`;
}
function marketFrame(k, i) {
  const m = Kit.series(k, '1M', 90), up = (m.chg ?? 0) >= 0;
  return `<div class="fr mf" data-i="${i}" style="--c:${MK[k]}"><div class="top"><div class="n">${Kit.ASSETS[k].name} · ${Kit.ASSETS[k].sym}</div><div class="p">${Kit.price(k, m.last)}</div>
    <div class="c ${up ? '' : 'dn'}">${m.chg == null ? '—' : `${up ? '▲ +' : '▼ '}${m.chg.toFixed(2)}%`} this month</div></div>
    ${Kit.spark(m.pts, { w: 320, h: 160, color: `rgb(${MK[k]})`, n: 90, stroke: 2.6, glow: 4, fillOpacity: .55, padX: 0 })}
    <button class="open" data-chart="${k}">Open ${k === 'usd' ? 'dollar' : k === 'ndq' ? 'Nasdaq' : 'gold'} chart</button></div>`;
}
function reel(frames) {
  count = frames.length;
  return `<section class="reel" id="reel"><div class="bars">${frames.map(() => '<i><b></b></i>').join('')}</div>${frames.join('')}<button class="zone l" aria-label="Previous"></button><button class="zone r" aria-label="Next"></button></section>`;
}
function show(n) {
  const r = document.getElementById('reel'); if (!r || !count) return;
  idx = (n + count) % count;
  r.querySelectorAll('.fr').forEach(f => f.classList.toggle('on', +f.dataset.i === idx));
  r.querySelectorAll('.bars i').forEach((b, i) => { b.className = i < idx ? 'done' : i === idx ? 'run' : ''; b.style.setProperty('--dur', DUR + 'ms'); const bb = b.firstChild; bb.style.animation = 'none'; void bb.offsetWidth; bb.style.animation = ''; });
  clearTimeout(timer); timer = setTimeout(() => show(idx + 1), DUR);
}
document.addEventListener('click', e => {
  const z = e.target.closest('.zone'); if (!z) return;
  show(idx + (z.classList.contains('r') ? 1 : -1));
});
// hold to pause, and keep reel swipes from switching tabs
['touchstart', 'touchmove', 'touchend'].forEach(ev => document.addEventListener(ev, e => {
  const r = e.target.closest?.('#reel'); if (!r) return;
  e.stopPropagation();
  if (ev === 'touchstart') { r.classList.add('paused'); clearTimeout(timer); r._x = e.touches[0].clientX; }
  if (ev === 'touchend') { r.classList.remove('paused'); const dx = (e.changedTouches[0].clientX - (r._x ?? 0)); if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1)); else { clearTimeout(timer); timer = setTimeout(() => show(idx + 1), DUR / 2); } }
}, { capture: true, passive: true }));
setInterval(() => { const c = document.getElementById('clk'); if (c) c.textContent = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' }).format(new Date()); }, 10000);
Kit.start({
  shell: () => `<aside class="rail"><span class="bgp" id="bgp"></span><span class="mark">B</span><nav>${Kit.TABS.map(t => `<button class="tab" data-tab="${t.id}">${t.name}</button>`).join('')}</nav><span class="clk" id="clk">${new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' }).format(new Date())}</span></aside>
    <div class="wrap"><header class="head" id="head"></header><main id="feedArea"></main></div>`,
  renderTab(tab, list) {
    document.getElementById('bgp').style.backgroundImage = `url('${Kit.photo(tab, 300, 2)}')`;
    const [a, b] = NAME[tab];
    document.getElementById('head').innerHTML = `<h1>${a} <span>${b}</span></h1><small>${list.length} stories</small>`;
    const area = document.getElementById('feedArea');
    if (tab === 'forex') {
      area.innerHTML = reel(['gold', 'usd', 'ndq'].map(marketFrame)) + `<div class="sec">What could move them</div><div class="list">${list.map((s, i) => s.fx ? fx(s, i) : card(s, i)).join('')}</div>`;
    } else {
      const head = list.slice(0, 5), rest = list.slice(5);
      area.innerHTML = reel(head.map(storyFrame)) + `<div class="sec">More ${tab === 'top' ? 'top stories' : 'from ' + Kit.catName(tab)}</div><div class="list">${rest.map(card).join('')}</div>`;
    }
    show(0);
  },
  chartShell: () => `<div class="ch-scrim"></div><section class="ch" role="dialog" aria-label="Chart">
    <div class="ch-top"><div class="ch-assets">${Object.entries(Kit.ASSETS).map(([k]) => `<button data-asset="${k}">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar' : 'Nasdaq'}</button>`).join('')}</div><button class="ch-x" data-close aria-label="Close">✕</button></div>
    <div class="ch-name"><span data-k="name"></span> · <span data-k="sym"></span></div>
    <div class="ch-price" data-k="price"></div><div class="ch-chg" data-k="chg"></div>
    <div data-k="chart"></div>
    <div class="ch-ranges">${Kit.RANGES.map(r => `<button data-range="${r}">${r}</button>`).join('')}</div>
    <div class="ch-types">${Kit.TYPES.map(([k, n]) => `<button data-type="${k}">${n}</button>`).join('')}</div><div class="ch-grab"></div></section>`,
  chartColors: up => ({ text: '#8a84a8', grid: 'rgba(255,255,255,.05)', cross: 'rgba(255,255,255,.45)', label: '#fbf8ff', labelText: '#140a06', up: '#47f0b1', down: '#ff5f86', main: up ? '#ffb048' : '#ff5f86', areaTop: up ? 'rgba(255,150,60,.38)' : 'rgba(255,95,134,.36)', areaBottom: 'rgba(255,94,58,0)', mono: '"Martian Mono", monospace' }),
});
</script>
</body>
</html>
