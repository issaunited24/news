<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Briefly Cover Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter+Tight:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root { --bg: #05070f; --ink: #f4f1ea; --mute: #8e95ad; color-scheme: dark; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top,0px) + 24px) 16px 60px; }
h1 { margin: 0; font: 600 30px/1.1 Fraunces, Georgia, serif; letter-spacing: -.02em; }
.lede { margin: 8px 0 0; color: var(--mute); }
h2 { margin: 34px 0 10px; font: 600 11px "IBM Plex Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: rgb(var(--t)); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.op { position: relative; isolation: isolate; overflow: hidden; border-radius: 16px; background: #0a0f22; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.op img { position: absolute; z-index: -2; max-width: none; }
.op::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(5,7,15,.35), rgba(5,7,15,0) 30%, rgba(5,7,15,.25) 70%, rgba(5,7,15,.75)); }
.op .n { position: absolute; top: 8px; left: 8px; min-width: 28px; height: 28px; padding: 0 9px; border-radius: 999px; display: grid; place-items: center; font: 700 13px "Inter Tight", sans-serif; color: #05070f; background: #fff; }
.op .d { position: absolute; left: 9px; right: 8px; bottom: 7px; font: 500 9.5px "IBM Plex Mono", monospace; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w { position: absolute; left: 0; font: 900 100px/.84 "Inter Tight", sans-serif; letter-spacing: -.055em; text-transform: uppercase; white-space: nowrap;
  background-size: cover; background-position: center 40%; -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: .5px rgba(255,255,255,.28); filter: brightness(1.5) saturate(1.2) drop-shadow(0 2px 8px rgba(0,0,0,.55)); }
.op.cur { box-shadow: 0 0 0 2px rgb(var(--t)), 0 0 18px -4px rgb(var(--t)); }
.op.cur .n::after { content: " · now"; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pick your cover photos</h1>
  <p class="lede">Each card is a small copy of the top of your phone screen, framed exactly the way the app will frame it. The outlined one is what each tab uses now. Tell me a number per tab, like "Forex 3, World 5", or "keep" for any you like as they are.</p>
  <div id="list"></div>
</div>
<script>
// [tab name, tint, title-fill photo, options: [photo id, focus x, focus y, description]] — first option = current
const SETS = [["Forex", "60,230,200", "1610375461246-83df859d849d", [["1689732888407-310424e3a372", 0.45, 0.5, "Now: market chart"], ["1624365168056-daf44387e2ae", 0.5, 0.45, "Gold bars and coins"], ["1611974789855-9c2a0a7236a3", 0.4, 0.5, "Red candles falling"], ["1649003515353-c58a239cf662", 0.45, 0.45, "Live quote board"], ["1590283603385-17ffb3a7f29f", 0.6, 0.45, "Trading screen"], ["1610375461369-d613b564f4c4", 0.5, 0.45, "Gold bar close-up"], ["1691404801714-07dab9c4dbce", 0.5, 0.5, "Vault of gold bars"]]], ["Top", "255,196,120", "1771422961300-a78dfdf11c5a", [["1778452419724-1f605dc17c46", 0.5, 0.5, "Now: Earth at night, glowing rim"], ["1614730321146-b6fa6a46bcb4", 0.5, 0.5, "Whole Earth"], ["1446776811953-b23d57bd21aa", 0.5, 0.4, "Earth from the space station"], ["1634176866089-b633f4aec882", 0.6, 0.5, "Earth night lights, edge"], ["1643330683233-ff2ac89b002c", 0.5, 0.45, "Blue Earth in space"], ["1540198163009-7afda7da2945", 0.5, 0.48, "Horizon from orbit"], ["1446776653964-20c1d3a81b06", 0.55, 0.5, "U.S. at night from space"]]], ["Just in", "255,96,120", "1651465531201-7e430660fd82", [["1624280433509-b01afeaf68e5", 0.5, 0.5, "Now: light trails"], ["1742805382149-3c2f0cd0f300", 0.5, 0.35, "Breaking news studio"], ["1498644035638-2c3357894b10", 0.6, 0.45, "Fresh newspapers"], ["1575507479993-7bb702d5e966", 0.4, 0.5, "Press cameras"], ["1659869508385-434ef2d98177", 0.55, 0.35, "Camera in a briefing room"]]], ["World", "255,150,90", "1513026705753-bc3fffca8bf4", [["1627484986972-e544190b8abb", 0.45, 0.45, "Now: Shanghai at night"], ["1663427929917-333d88949f7a", 0.35, 0.5, "Earth, Asia and Africa"], ["1451187580459-43490279c0fa", 0.35, 0.65, "City lights from orbit"], ["1589519160732-57fc498494f8", 0.7, 0.3, "Glowing globe in hands"], ["1521295121783-8a321d551ad2", 0.7, 0.5, "Desk globe"], ["1782743549468-97ead60055f9", 0.5, 0.75, "Tokyo at night"], ["1524661135-423995f22d0b", 0.5, 0.5, "World map"]]], ["U.S.", "120,160,255", "1562884328-39da45501a9c", [["1701690544250-f7cb95c934aa", 0.5, 0.4, "Now: Capitol dome at night"], ["1520525003249-2b9cdda513bc", 0.5, 0.35, "Capitol, blue sky"], ["1543372654-b45dd90eeee5", 0.54, 0.45, "Capitol at night, from the Mall"], ["1594581979864-36977b15d0dc", 0.65, 0.42, "Capitol at golden hour"], ["1675721554936-2628b714081e", 0.48, 0.38, "White House podium"], ["1500632907344-a073709b2448", 0.65, 0.4, "New York and Brooklyn Bridge"], ["1767342007060-694d6a7db73f", 0.47, 0.45, "New York skyline"]]], ["Science", "90,220,255", "1610296669228-602fa827fc1f", [["1504333638930-c8787321eee0", 0.45, 0.5, "Now: Orion nebula"], ["1608178398319-48f814d0750c", 0.5, 0.55, "Pink Orion nebula"], ["1717705422478-0b42e89e06b7", 0.45, 0.55, "Horsehead nebula"], ["1462331940025-496dfbfc7564", 0.45, 0.5, "Bubble nebula"], ["1677357623576-7c8aab08da22", 0.5, 0.5, "Spiral galaxy"], ["1457364887197-9150188c107b", 0.65, 0.4, "Rocket launch trail"], ["1454789548928-9efd52dc4031", 0.5, 0.38, "Astronaut above Earth"]]], ["Tech & AI", "160,120,255", "1587845323226-bad89242c735", [["1677442135703-1787eea5ce01", 0.68, 0.5, "Now: circuit brain"], ["1697577418970-95d99b5a55cf", 0.5, 0.35, "AI chip"], ["1782170932323-8f03eb41cc96", 0.55, 0.5, "Infinity room of lights"], ["1674027444485-cec3da58eef4", 0.48, 0.4, "Network brain hologram"], ["1757466762489-52fea38071ad", 0.6, 0.6, "Particle waves"], ["1644088379091-d574269d422f", 0.5, 0.55, "Blue network lines"]]], ["Entertainment", "255,90,190", "1540039155733-5bb30b53aa14", [["1609924211018-5526c55bad5b", 0.47, 0.57, "Now: Hollywood sign"], ["1746288864555-5e8e09c420aa", 0.53, 0.5, "Hollywood sign, close"], ["1501103777042-0aeb4df8ff8f", 0.7, 0.45, "Hollywood sign, moody sky"], ["1581390114939-946f9a890a7f", 0.52, 0.5, "Hollywood hills"], ["1705547914719-9358fe34c483", 0.5, 0.47, "Hollywood through palms"], ["1536440136628-849c177e76a1", 0.55, 0.4, "Neon cinema"], ["1459749411175-04bf5292ceea", 0.4, 0.65, "Concert lights"]]], ["Sports", "255,130,60", "1767016697775-001518392206", [["1626003573503-2e088d82c647", 0.48, 0.42, "Now: basketball arena"], ["1522778119026-d647f0596c20", 0.5, 0.55, "Packed soccer stadium"], ["1489944440615-453fc2b6a9a9", 0.45, 0.6, "Stadium under the lights"], ["1679391029864-d46f366a456b", 0.45, 0.6, "Night match"], ["1573838886533-c90767b6e60e", 0.5, 0.5, "Stadium from above, city"], ["1556764420-e37ef4cdfa5c", 0.6, 0.4, "Floodlights and crowd"], ["1545191050-96042d612b1f", 0.5, 0.3, "MMA fighters"]]]];
const U = (id, w) => `https://images.unsplash.com/photo-${id}?auto=format&q=70&w=${w}`;
// Same framing math as the app: the photo's focus point lands in the open space above the tab name
function frame(im, focus, W, H) {
  const w = im.naturalWidth, h = im.naturalHeight; if (!w || !h) return;
  const [fx, fy] = focus, tx = W / 2, ty = H * 0.17;
  const need = bottom => Math.max(W / w, tx / (fx * w), (W - tx) / ((1 - fx) * w), ty / (fy * h), (bottom - ty) / ((1 - fy) * h));
  const cap = 1.8 * Math.max(W / w, H / h);
  const sc = Math.max(need(H * 0.62), Math.min(need(H), cap));
  const iw = w * sc, ih = h * sc;
  const ox = Math.min(0, Math.max(W - iw, tx - fx * iw)), oy = Math.min(0, Math.max(H * 0.62 - ih, ty - fy * ih));
  im.style.cssText = `width:${iw}px;height:${ih}px;left:${ox}px;top:${oy}px`;
}
const PHONE_W = 412, PHONE_H = 870, SHOW = 0.38; // the cards show the top 38% of a phone screen: the cover with its title
const list = document.getElementById('list');
list.innerHTML = SETS.map(([name, t, fill, opts]) => `<h2 style="--t:${t}">${name}</h2><div class="grid">${opts.map(([id, fx, fy, d], i) =>
  `<div class="op${i === 0 ? ' cur' : ''}" style="--t:${t}" data-fx="${fx}" data-fy="${fy}"><img src="${U(id, 900)}" alt="${d}" loading="${i < 2 ? 'eager' : 'lazy'}"><span class="n">${i + 1}</span>
  <div class="w" style="background-image:linear-gradient(180deg, rgba(255,255,255,.34), rgba(${t},.26)), url('${U(fill, 600)}'), linear-gradient(120deg, rgb(${t}), #fff 60%, rgb(${t}))">${name}</div><span class="d">${d}</span></div>`).join('')}</div>`).join('');
function layout() {
  for (const op of document.querySelectorAll('.op')) {
    const cw = op.clientWidth, k = cw / PHONE_W, H = PHONE_H * k;
    op.style.height = Math.round(H * SHOW) + 'px';
    const im = op.querySelector('img'), go = () => frame(im, [+op.dataset.fx, +op.dataset.fy], cw, H);
    if (im.complete) go(); else im.onload = go;
    // the tab name: same size rule as the app (fit the width, at most 118px), scaled to the card
    const wd = op.querySelector('.w'); wd.style.fontSize = '118px'; wd.style.left = 14 * k + 'px';
    const full = wd.getBoundingClientRect().width / k, fit = Math.min(118, 118 * (PHONE_W - 30) / full);
    wd.style.fontSize = fit * k + 'px';
    wd.style.top = (H * 0.25) + 'px';
  }
}
layout(); document.fonts?.ready?.then(layout); addEventListener('resize', layout);
</script>
</body>
</html>
