<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>Briefly · Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Bento: the app as a box of tiles. The tabs are photographs, the front page is a mosaic, and the chart flips open like a card. */
:root {
  --bg: #0a0f1c; --tile: #121a2e; --tile2: #18223b; --ink: #f4f6fb; --ink2: #c9cfdf; --mute: #8790a8; --faint: #4f5872;
  --lime: 198,255,61;
  --ui: "Bricolage Grotesque", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --up: #45f0ad; --down: #ff6688;
  color-scheme: dark;
}
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.amb { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(50% 30% at 100% 0%, rgba(var(--lime),.07), transparent 70%), radial-gradient(60% 40% at 0% 30%, rgba(60,110,255,.12), transparent 70%), radial-gradient(70% 40% at 60% 100%, rgba(40,200,190,.1), transparent 70%), linear-gradient(180deg, #0c1222, #0a0f1c); }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

.top { display: flex; align-items: baseline; gap: 10px; padding: calc(env(safe-area-inset-top,0px) + 16px) 16px 4px; }
.logo { font: 800 26px var(--ui); letter-spacing: -.04em; }
.logo i { font-style: normal; display: inline-block; width: 9px; height: 9px; margin-left: 2px; border-radius: 3px; background: rgb(var(--lime)); box-shadow: 0 0 14px rgba(var(--lime),.8); }
.when { margin-left: auto; font: 500 11px var(--mono); color: var(--mute); }

/* photo tabs */
.tabs { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; padding: calc(env(safe-area-inset-top,0px) + 10px) 16px 12px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(180deg, rgba(10,15,28,.96), rgba(10,15,28,.85) 80%, rgba(10,15,28,0)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; flex: none; width: 78px; height: 58px; border-radius: 16px; overflow: hidden; text-align: left; background: var(--tile); transition: width .45s cubic-bezier(.3,1.2,.4,1), box-shadow .3s; }
.tab img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.6) brightness(.55); transition: filter .4s, transform .6s; }
.tab span { position: absolute; left: 9px; bottom: 7px; right: 6px; font: 700 12px var(--ui); letter-spacing: -.01em; text-shadow: 0 1px 8px rgba(0,0,0,.8); white-space: nowrap; }
.tab::after { content: ""; position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(180deg, transparent 30%, rgba(10,15,28,.75)); }
.tab span { z-index: 1; }
.tab[aria-selected="true"] { width: 132px; box-shadow: 0 0 0 2px rgb(var(--lime)), 0 8px 24px -8px rgba(var(--lime),.6); }
.tab[aria-selected="true"] img { filter: saturate(1.1) brightness(.9); transform: scale(1.08); }

/* bento grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 16px 0; }
.t { position: relative; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, var(--tile2), var(--tile)); animation: pop .5s cubic-bezier(.2,.9,.3,1.15) both; }
.t.w { grid-column: span 2; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } }
.ph { display: block; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,15,28,0) 35%, rgba(10,15,28,.92)); }
.ph .in { position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 12px; }
.lead { height: 270px; } .lead .h { font-size: 23px; line-height: 1.1; }
.sq { height: 176px; } .sq .h { font-size: 14.5px; -webkit-line-clamp: 4; }
.hero { height: 150px; } .hero h1 { margin: 0; font: 800 34px/1 var(--ui); letter-spacing: -.04em; } .hero p { margin: 4px 0 0; font: 500 11px var(--mono); color: var(--ink2); }
.tick { display: flex; align-items: center; gap: 10px; height: 48px; padding-left: 14px; background: rgba(var(--lime),.08); box-shadow: inset 0 0 0 1px rgba(var(--lime),.25); }
.tick b { flex: none; font: 600 10px var(--mono); padding: 4px 8px; border-radius: 8px; color: #0a0f1c; background: rgb(var(--lime)); letter-spacing: .08em; }
.tick .mq { flex: 1; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.tick .mq div { display: inline-flex; gap: 28px; white-space: nowrap; font: 600 13px var(--ui); animation: marquee 60s linear infinite; }
.tick .mq span::before { content: "◆"; margin-right: 10px; color: rgb(var(--lime)); font-size: 9px; vertical-align: 2px; }
@keyframes marquee { to { transform: translateX(-50%); } }
/* market tile inside the bento */
.mt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 14px; height: 176px; background: radial-gradient(100% 80% at 100% 0%, rgba(var(--c),.3), transparent 60%), linear-gradient(160deg, var(--tile2), var(--tile)); box-shadow: inset 0 0 0 1px rgba(var(--c),.28), 0 0 26px -10px rgba(var(--c),.7); }
.mt.big { height: 196px; }
.mt .n { font: 600 11px var(--mono); letter-spacing: .1em; color: rgb(var(--c)); text-transform: uppercase; }
.mt .p { margin-top: 6px; font: 800 26px/1 var(--ui); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.mt.big .p { font-size: 34px; }
.mt .c { margin-top: 4px; font: 600 11px var(--mono); color: var(--up); } .mt .c.dn { color: var(--down); }
.mt svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 76px; }
.mt.big svg { height: 96px; }
.mt .arr { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; font-size: 13px; color: #0a0f1c; background: rgb(var(--c)); box-shadow: 0 0 14px rgba(var(--c),.7); }
.ses { padding: 14px; }
.ses .lb { display: flex; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--mute); }
.ses .day { position: relative; height: 34px; margin-top: 8px; border-radius: 10px; background: rgba(255,255,255,.04); overflow: hidden; }
.ses .day i { position: absolute; top: 4px; bottom: 4px; border-radius: 7px; font: 600 10px var(--mono); font-style: normal; display: flex; align-items: center; padding-left: 7px; color: rgba(255,255,255,.75); background: rgba(255,255,255,.08); white-space: nowrap; overflow: hidden; }
.ses .day i.on { color: #0a0f1c; background: rgb(var(--lime)); box-shadow: 0 0 14px rgba(var(--lime),.6); }
.ses .day u { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; }

/* list cards */
.sec { display: flex; align-items: center; gap: 10px; padding: 22px 16px 10px; font: 700 15px var(--ui); letter-spacing: -.01em; }
.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.12), transparent); }
.list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 60px; }
.card { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 13px; padding: 10px; border-radius: 22px; background: linear-gradient(160deg, var(--tile2), var(--tile)); animation: pop .5s cubic-bezier(.2,.9,.3,1.15) both; transition: transform .2s; }
.card:active { transform: scale(.98); }
.card .im { width: 96px; height: 96px; border-radius: 16px; overflow: hidden; background: var(--bg); }
.card .im img { width: 100%; height: 100%; object-fit: cover; }
.card.wide { grid-template-columns: 1fr; padding: 0; overflow: hidden; }
.card.wide .im { width: 100%; height: 170px; border-radius: 0; }
.card.wide .tx { padding: 2px 14px 14px; }
.meta { display: flex; align-items: center; gap: 7px; font: 500 10.5px var(--mono); color: var(--mute); min-width: 0; }
.meta .o { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h { margin: 4px 0 0; font: 700 16px/1.24 var(--ui); letter-spacing: -.015em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum { margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live { font: 600 9.5px var(--mono); padding: 2px 6px; border-radius: 6px; color: #fff; background: #ff3b5c; letter-spacing: .06em; }
/* Forex news */
.fx { display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 13px; padding: 10px 12px 10px 10px; border-radius: 22px; animation: pop .5s both;
  background: radial-gradient(90% 100% at 0% 0%, rgba(var(--g),.18), transparent 60%), linear-gradient(160deg, var(--tile2), var(--tile));
  box-shadow: inset 0 0 0 1.5px rgba(var(--g),.6), 0 0 20px -4px rgba(var(--g),.65), 0 0 60px -20px rgba(var(--g),.6); }
.fx.pulse { animation: pop .5s both, neon 2.6s ease-in-out infinite; }
@keyframes neon { 50% { box-shadow: inset 0 0 0 1.5px rgba(var(--g),.95), 0 0 30px -2px rgba(var(--g),.85), 0 0 80px -16px rgba(var(--g),.75); } }
.box3 { display: grid; gap: 4px; align-self: start; }
.box3 > div { padding: 5px 6px 3px; border-radius: 9px; background: rgba(5,8,18,.6); }
.box3 .r { display: flex; justify-content: space-between; font: 600 8.5px var(--mono); color: var(--mute); }
.box3 svg { width: 100%; height: 13px; display: block; }
.lvl { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--g)); text-shadow: 0 0 10px rgba(var(--g),.9); }

/* chart: flips open like a card */
#chartPanel { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 14px; perspective: 1400px; }
.ch-scrim { position: absolute; inset: 0; background: rgba(5,8,16,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .35s; }
.ch { position: relative; width: 100%; max-width: 520px; padding: 16px; border-radius: 28px; background: linear-gradient(160deg, #1b2642, #111a2e);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 40px 80px -20px #000, 0 0 50px -20px rgba(var(--lime),.4);
  transform: rotateY(-75deg) scale(.85); opacity: 0; transition: transform .6s cubic-bezier(.2,1.1,.3,1), opacity .3s; backface-visibility: hidden; }
#chartPanel.open .ch-scrim { opacity: 1; } #chartPanel.open .ch { transform: none; opacity: 1; }
.ch-assets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-right: 46px; }
.ch-assets button { height: 36px; border-radius: 12px; font: 700 12.5px var(--ui); color: var(--mute); background: rgba(255,255,255,.05); }
.ch-assets button[aria-pressed="true"] { color: #0a0f1c; background: rgb(var(--lime)); box-shadow: 0 0 16px -2px rgba(var(--lime),.7); }
.ch-x { position: absolute; right: 16px; top: 16px; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--ink2); background: rgba(255,255,255,.07); }
.ch-hd { display: grid; grid-template-columns: 1fr auto; align-items: end; margin-top: 16px; }
.ch-name { font: 600 11px var(--mono); color: var(--mute); letter-spacing: .08em; }
.ch-price { margin-top: 2px; font: 800 40px/1 var(--ui); letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.ch-chg { font: 600 12px var(--mono); color: var(--up); text-align: right; } .ch-chg.dn { color: var(--down); } .ch-chg span { display: block; color: var(--mute); } .ch-chg .ch-time { display: inline; color: var(--ink2); }
[data-k=chart] { height: 220px; margin: 12px -4px 10px; }
.ch-msg { display: grid; place-items: center; height: 100%; color: var(--mute); font-size: 13px; }
.ch-ctl { display: grid; grid-template-columns: 1fr; gap: 8px; }
.ch-ranges, .ch-types { display: grid; gap: 4px; }
.ch-ranges { grid-template-columns: repeat(6, 1fr); } .ch-types { grid-template-columns: repeat(4, 1fr); }
.ch-ranges button, .ch-types button { height: 36px; border-radius: 12px; font: 600 12px var(--ui); color: var(--mute); background: rgba(255,255,255,.04); transition: .2s; }
.ch-ranges button { font-family: var(--mono); }
.ch-ranges button[aria-pressed="true"], .ch-types button[aria-pressed="true"] { color: var(--ink); background: rgba(var(--lime),.14); box-shadow: inset 0 0 0 1.5px rgba(var(--lime),.8); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="amb" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<div id="chartPanel" hidden></div>
<script src="kit.js"></script>
<script>
const { esc, ago } = Kit;
const GLOW = { red: '255,64,100', gold: '255,196,60', cyan: '60,225,255' };
const MK = { gold: '255,200,87', usd: '60,225,255', ndq: '255,92,200' };
const SUB = { world: 'Beyond the United States', us: 'Politics, culture and the feed', tech: 'Models, chips and the frontier' };
const meta = s => `<div class="meta">${s.breaking ? '<span class="live">LIVE</span>' : ''}<span class="o">${esc(s.outlet)}</span><span>· ${ago(s.published)}</span></div>`;
function card(s, i, wide) {
  const t = Kit.thumb(s, Kit.catOf(s), wide ? 900 : 260);
  return `<a class="card ${wide ? 'wide' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 8) * 40}ms"><div class="im">${Kit.img(t, '')}</div>
    <div class="tx" style="min-width:0">${meta(s)}<h3 class="h">${esc(s.title)}</h3>${s.summary ? `<p class="sum">${esc(s.summary)}</p>` : ''}</div></a>`;
}
// rhythm: every fifth story becomes a wide photo card so the list never feels repetitive
const rhythm = list => list.map((s, i) => card(s, i, i % 5 === 4)).join('');
function photoTile(s, cls, i) {
  const t = Kit.thumb(s, Kit.catOf(s), cls === 'lead' ? 1000 : 500);
  return `<a class="t ph ${cls} ${cls === 'lead' ? 'w' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${i * 60}ms">${Kit.img(t, '')}<div class="in">${meta(s)}<h3 class="h">${esc(s.title)}</h3></div></a>`;
}
function mTile(k, big, i) {
  const m = Kit.series(k, '1W'), up = (m.chg ?? 0) >= 0;
  return `<button class="t mt ${big ? 'big w' : ''}" data-chart="${k}" style="--c:${MK[k]};animation-delay:${i * 60}ms"><span class="arr">↗</span>
    <div class="n">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar · DXY' : 'Nasdaq'}</div><div class="p">${Kit.price(k, m.last)}</div>
    <div class="c ${up ? '' : 'dn'}">${m.chg == null ? '—' : `${up ? '+' : ''}${m.chg.toFixed(2)}%`} · 1W</div>
    ${Kit.spark(m.pts, { w: big ? 360 : 180, h: big ? 96 : 76, color: `rgb(${MK[k]})`, n: 80, stroke: 2, glow: 2.6, fillOpacity: .5, padX: 0 })}</button>`;
}
function sessions() {
  const utc = new Date(), mins = utc.getUTCHours() * 60 + utc.getUTCMinutes();
  // approximate main sessions in UTC
  const S = [['Sydney', 21, 6], ['Tokyo', 0, 9], ['London', 7, 16], ['New York', 12.5, 21]];
  const seg = (n, l, r, on) => `<i class="${on ? 'on' : ''}" style="left:${l / 24 * 100}%;width:${(r - l) / 24 * 100}%">${n}</i>`;
  const bars = S.map(([n, a, b]) => { const on = a < b ? mins >= a * 60 && mins < b * 60 : mins >= a * 60 || mins < b * 60; return a < b ? seg(n, a, b, on) : seg('', a, 24, on) + seg(n, 0, b, on); });
  return `<div class="t w ses"><div class="lb"><span>Trading sessions · UTC</span><span>${String(utc.getUTCHours()).padStart(2, '0')}:${String(utc.getUTCMinutes()).padStart(2, '0')}</span></div>
    <div class="day">${bars[0]}${bars[2]}</div><div class="day">${bars[1]}${bars[3]}</div><u style="display:none"></u></div>`;
}
function ticker(list) {
  const items = list.slice(0, 8).map(s => `<span>${esc(s.title)}</span>`).join('');
  return `<div class="t w tick"><b>NOW</b><div class="mq"><div>${items}${items}</div></div></div>`;
}
function fx(s, i) {
  const lv = Kit.level(s), fc = Kit.forecasts(s.fx, { w: 70, h: 13 });
  return `<a class="fx ${lv.k === 'red' ? 'pulse' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="--g:${GLOW[lv.k]};animation-delay:${Math.min(i, 8) * 40}ms">
    <div class="box3">${fc.map(f => `<div><div class="r"><span>${f.label}</span><span style="color:${f.color}">${f.dir === 'up' ? '▲' : f.dir === 'down' ? '▼' : '–'} ${f.conf || ''}</span></div>${f.svg}</div>`).join('')}</div>
    <div style="min-width:0"><div class="meta"><span class="lvl">${lv.tag}</span><span class="o">${esc(s.outlet)}</span><span>· ${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.fx?.why ? `<p class="sum">${esc(s.fx.why)}</p>` : ''}</div></a>`;
}
Kit.start({
  shell: () => `<div class="top"><span class="logo">Briefly<i></i></span><span class="when">${new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date())}</span></div>
    <nav class="tabs">${Kit.TABS.map(t => `<button class="tab" data-tab="${t.id}"><img src="${Kit.photo(t.id, 300, 0)}" alt=""><span>${t.name}</span></button>`).join('')}</nav><main id="feedArea"></main>`,
  renderTab(tab, list) {
    const area = document.getElementById('feedArea');
    if (tab === 'top') {
      const [a, b, ...rest] = list;
      area.innerHTML = `<div class="grid">${a ? photoTile(a, 'lead', 0) : ''}${mTile('gold', false, 1)}${b ? photoTile(b, 'sq', 2) : ''}${ticker(Kit.stories('us').concat(Kit.stories('world')))}</div>
        <div class="sec">Also making headlines</div><div class="list">${rhythm(rest)}</div>`;
      return;
    }
    if (tab === 'forex') {
      area.innerHTML = `<div class="grid">${mTile('gold', true, 0)}${mTile('usd', false, 1)}${mTile('ndq', false, 2)}${sessions()}</div>
        <div class="sec">What could move them</div><div class="list">${list.map((s, i) => s.fx ? fx(s, i) : card(s, i)).join('')}</div>`;
      return;
    }
    const [a, ...rest] = list;
    area.innerHTML = `<div class="grid"><div class="t w ph hero" style="animation-delay:0ms"><img src="${Kit.photo(tab, 1000, 1)}" alt=""><div class="in"><h1>${Kit.catName(tab)}</h1><p>${SUB[tab]} · ${list.length} stories</p></div></div>
      ${a ? photoTile(a, 'lead', 1) : ''}</div><div class="sec">Latest</div><div class="list">${rhythm(rest)}</div>`;
  },
  chartShell: () => `<div class="ch-scrim"></div><section class="ch" role="dialog" aria-label="Chart">
    <div class="ch-assets">${Object.entries(Kit.ASSETS).map(([k]) => `<button data-asset="${k}">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar' : 'Nasdaq'}</button>`).join('')}</div>
    <button class="ch-x" data-close aria-label="Close">✕</button>
    <div class="ch-hd"><div><div class="ch-name"><span data-k="name"></span> · <span data-k="sym"></span></div><div class="ch-price" data-k="price"></div></div><div class="ch-chg" data-k="chg"></div></div>
    <div data-k="chart"></div>
    <div class="ch-ctl"><div class="ch-ranges">${Kit.RANGES.map(r => `<button data-range="${r}">${r}</button>`).join('')}</div>
    <div class="ch-types">${Kit.TYPES.map(([k, n]) => `<button data-type="${k}">${n}</button>`).join('')}</div></div></section>`,
  chartColors: up => ({ text: '#7f89a3', grid: 'rgba(255,255,255,.05)', cross: 'rgba(198,255,61,.7)', label: '#c6ff3d', labelText: '#0a0f1c', up: '#45f0ad', down: '#ff6688', main: up ? '#c6ff3d' : '#ff6688', areaTop: up ? 'rgba(198,255,61,.3)' : 'rgba(255,102,136,.34)', areaBottom: 'rgba(198,255,61,0)', mono: '"Geist Mono", monospace' }),
});
</script>
</body>
</html>
