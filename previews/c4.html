<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0716">
<title>Briefly · Neon Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Neon Noir: violet night, magenta and cyan light, the photograph poured inside giant letters */
:root {
  --bg: #0a0716; --ink: #f6f0ff; --ink2: #cbbfe6; --mute: #8f84ad; --faint: #574d74;
  --mag: 255,62,165; --vio: 139,92,255; --cy: 61,232,255; --acc: var(--mag);
  --ui: "Space Grotesk", system-ui, sans-serif; --mono: "Space Mono", ui-monospace, monospace;
  --up: #3dffb5; --down: #ff4f8b;
  color-scheme: dark;
}
body[data-view=top] { --acc: 255,62,165; } body[data-view=world] { --acc: 255,140,80; } body[data-view=us] { --acc: 110,140,255; } body[data-view=forex] { --acc: 61,232,255; } body[data-view=tech] { --acc: 139,92,255; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.night { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(70% 45% at 100% 0%, rgba(var(--acc),.18), transparent 70%), radial-gradient(60% 40% at 0% 45%, rgba(var(--vio),.16), transparent 70%), radial-gradient(90% 50% at 50% 110%, rgba(40,30,120,.5), transparent 70%), linear-gradient(180deg, #0c0820, #0a0716 50%, #080512); transition: background 1s; }
.scan { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .05; background: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px); }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

.bar { display: flex; align-items: center; padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 0; }
.logo { font: 700 18px var(--ui); letter-spacing: .02em; text-transform: uppercase; }
.logo span { color: rgb(var(--acc)); text-shadow: 0 0 14px rgba(var(--acc),.9); transition: .8s; }
.sig { margin-left: auto; display: flex; gap: 3px; align-items: flex-end; height: 14px; }
.sig i { width: 3px; border-radius: 1px; background: rgb(var(--acc)); box-shadow: 0 0 6px rgb(var(--acc)); animation: eq 1.2s ease-in-out infinite; }
.sig i:nth-child(1) { height: 6px; } .sig i:nth-child(2) { height: 12px; animation-delay: .2s; } .sig i:nth-child(3) { height: 9px; animation-delay: .4s; } .sig i:nth-child(4) { height: 14px; animation-delay: .6s; }
@keyframes eq { 50% { transform: scaleY(.4); } }

/* the photo inside the letters */
.mast { position: relative; height: 220px; margin-top: 4px; overflow: hidden; }
.mast .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .28; filter: blur(2px) saturate(1.2); mask-image: linear-gradient(180deg, #000 30%, transparent); -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent); }
.mast h1 { position: absolute; left: 14px; right: 0; bottom: 34px; margin: 0; font: 700 clamp(64px, 23vw, 120px)/.82 var(--ui); letter-spacing: -.06em; text-transform: uppercase; white-space: nowrap;
  background-size: cover; background-position: center 40%; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(var(--acc),.35)); animation: pour 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pour { from { opacity: 0; letter-spacing: .02em; } }
.mast p { position: absolute; left: 18px; right: 18px; bottom: 10px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 400 11px var(--mono); color: var(--ink2); letter-spacing: .04em; }
.mast p b { color: rgb(var(--acc)); font-weight: 400; }

.tabs { position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; padding: calc(env(safe-area-inset-top,0px) + 10px) 14px 10px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(180deg, rgba(10,7,22,.92), rgba(10,7,22,.7) 80%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: flex; align-items: baseline; gap: 6px; padding: 8px 13px; border-radius: 12px; font: 600 13px var(--ui); color: var(--mute); background: rgba(255,255,255,.03); transition: .3s; }
.tab small { font: 400 9px var(--mono); color: var(--faint); }
.tab[aria-selected="true"] { color: var(--ink); background: rgba(var(--acc),.14); box-shadow: inset 0 0 0 1px rgba(var(--acc),.55), 0 0 18px -4px rgba(var(--acc),.7); }
.tab[aria-selected="true"] small { color: rgb(var(--acc)); }

/* split cards: photo bleeds from the left edge */
.list { display: flex; flex-direction: column; gap: 12px; padding: 8px 14px 60px; }
.card { position: relative; display: grid; grid-template-columns: 36% minmax(0, 1fr); min-height: 124px; border-radius: 20px; overflow: hidden;
  background: linear-gradient(120deg, rgba(var(--vio),.10), rgba(255,255,255,.025)), #120d26; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 16px 30px -22px #000; animation: slide .55s cubic-bezier(.2,.8,.2,1) both; }
.card .ph { position: relative; overflow: hidden; }
.card .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 55%, #120d26), linear-gradient(0deg, rgba(var(--acc),.25), transparent 50%); mix-blend-mode: normal; }
.card .tx { padding: 12px 14px 12px 4px; min-width: 0; }
@keyframes slide { from { opacity: 0; transform: translateX(-16px); } }
.meta { display: flex; align-items: center; gap: 8px; font: 400 10px var(--mono); color: var(--mute); letter-spacing: .03em; text-transform: uppercase; min-width: 0; }
.meta .o { color: rgb(var(--acc)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h { margin: 5px 0 0; font: 600 15.5px/1.27 var(--ui); letter-spacing: -.012em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum { margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live { color: #fff; background: rgb(var(--mag)); padding: 1px 5px; border-radius: 3px; box-shadow: 0 0 10px rgb(var(--mag)); }
/* Top lead: wide cinema card */
.lead { position: relative; display: block; height: 240px; border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(var(--acc),.4), 0 0 40px -16px rgba(var(--acc),.8); animation: slide .55s both; }
.lead img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lead::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,7,22,0) 30%, rgba(10,7,22,.95)), linear-gradient(90deg, rgba(var(--acc),.25), transparent 60%); }
.lead .in { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 14px; }
.lead .h { font-size: 21px; line-height: 1.15; }

/* Forex: ticker rails */
.rails { display: flex; flex-direction: column; gap: 10px; padding: 6px 14px 10px; }
.rail { position: relative; display: grid; grid-template-columns: 1fr 1.25fr; align-items: center; gap: 10px; height: 92px; padding: 0 0 0 16px; border-radius: 20px; overflow: hidden; text-align: left;
  background: linear-gradient(90deg, rgba(var(--c),.16), rgba(var(--c),.02) 60%), #110c25; box-shadow: inset 0 0 0 1px rgba(var(--c),.4), inset 0 1px 0 rgba(255,255,255,.1), 0 0 28px -8px rgba(var(--c),.6); animation: slide .5s both; }
.rail::after { content: ""; position: absolute; left: 16px; right: 40%; bottom: 0; height: 2px; background: linear-gradient(90deg, rgb(var(--c)), transparent); box-shadow: 0 0 12px rgb(var(--c)); }
.rail .n { font: 400 10px var(--mono); letter-spacing: .12em; color: rgb(var(--c)); text-shadow: 0 0 10px rgba(var(--c),.9); }
.rail .p { margin-top: 4px; font: 700 24px/1 var(--ui); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.rail .c { margin-top: 4px; font: 400 11px var(--mono); color: var(--up); } .rail .c.dn { color: var(--down); }
.rail svg { width: 100%; height: 92px; display: block; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%); mask-image: linear-gradient(90deg, transparent, #000 22%); }
.clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 14px 14px; }
.clock div { padding: 8px 6px; border-radius: 12px; text-align: center; font: 400 9.5px var(--mono); color: var(--faint); background: rgba(255,255,255,.03); }
.clock div b { display: block; font: 600 12px var(--ui); color: var(--mute); }
.clock div.on { color: rgb(var(--cy)); background: rgba(var(--cy),.1); box-shadow: inset 0 0 0 1px rgba(var(--cy),.45), 0 0 14px -4px rgba(var(--cy),.8); } .clock div.on b { color: var(--ink); }
/* Forex news: neon importance frame with lit corners */
.fx { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 18px; background: #110c25;
  box-shadow: inset 0 0 0 1px rgba(var(--g),.5), 0 0 18px -4px rgba(var(--g),.7), 0 0 50px -16px rgba(var(--g),.6); animation: slide .55s both; }
.fx::before, .fx::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid rgb(var(--g)); filter: drop-shadow(0 0 6px rgb(var(--g))); }
.fx::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 18px; }
.fx::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 18px; }
.fx.pulse { animation: slide .55s both, buzz 2.6s steps(1) infinite; }
@keyframes buzz { 0%, 100% { opacity: 1; } 92% { opacity: .82; } 94% { opacity: 1; } 96% { opacity: .9; } }
.scope { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 12px; background: #07040f; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); align-self: start; }
.scope > div { font: 400 8px var(--mono); color: var(--mute); }
.scope .r { display: flex; justify-content: space-between; }
.scope svg { width: 100%; height: 15px; display: block; }
.lvl { font: 700 10px var(--mono); letter-spacing: .14em; color: rgb(var(--g)); text-shadow: 0 0 10px rgb(var(--g)); }

/* chart: a neon card that springs up */
#chartPanel { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 10px 10px calc(10px + env(safe-area-inset-bottom,0px)); }
.ch-scrim { position: absolute; inset: 0; background: rgba(6,3,14,.7); backdrop-filter: blur(6px) saturate(.7); -webkit-backdrop-filter: blur(6px) saturate(.7); opacity: 0; transition: opacity .3s; }
.ch { position: relative; width: 100%; max-width: 520px; padding: 16px 16px 12px; border-radius: 26px; background: linear-gradient(180deg, #171032, #0d0920);
  box-shadow: inset 0 0 0 1px rgba(var(--mag),.45), 0 0 30px -6px rgba(var(--mag),.6), 0 0 90px -30px rgba(var(--vio),.9), 0 30px 60px -20px #000;
  transform: translateY(100%) rotateX(18deg); transform-origin: 50% 100%; opacity: 0; transition: transform .55s cubic-bezier(.2,1.25,.35,1), opacity .2s; }
#chartPanel.open .ch-scrim { opacity: 1; } #chartPanel.open .ch { transform: none; opacity: 1; }
.ch-top { display: flex; align-items: center; gap: 6px; }
.ch-assets { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.04); }
.ch-assets button { height: 30px; padding: 0 11px; border-radius: 9px; font: 400 10.5px var(--mono); color: var(--mute); letter-spacing: .06em; }
.ch-assets button[aria-pressed="true"] { color: var(--ink); background: rgba(var(--mag),.2); box-shadow: inset 0 0 0 1px rgba(var(--mag),.6); }
.ch-x { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--ink2); background: rgba(255,255,255,.05); }
.ch-name { margin-top: 14px; font: 400 10.5px var(--mono); color: var(--mute); letter-spacing: .12em; text-transform: uppercase; } .ch-name [data-k=sym] { color: rgb(var(--mag)); }
.ch-price { margin-top: 4px; font: 700 40px/1 var(--ui); letter-spacing: -.04em; font-variant-numeric: tabular-nums; text-shadow: 0 0 30px rgba(var(--mag),.35); }
.ch-chg { margin-top: 6px; font: 400 12px var(--mono); color: var(--up); } .ch-chg.dn { color: var(--down); } .ch-chg span { color: var(--mute); margin-left: 4px; } .ch-chg .ch-time { color: var(--ink2); margin: 0; }
[data-k=chart] { height: 220px; margin: 10px -4px 6px; }
.ch-msg { display: grid; place-items: center; height: 100%; color: var(--mute); font-size: 13px; }
.ch-row { display: flex; align-items: center; gap: 8px; }
.ch-ranges { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); }
.ch-ranges button { position: relative; height: 38px; font: 400 11.5px var(--mono); color: var(--mute); }
.ch-ranges button[aria-pressed="true"] { color: var(--ink); }
.ch-ranges button[aria-pressed="true"]::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: 5px; height: 2px; border-radius: 2px; background: rgb(var(--mag)); box-shadow: 0 0 10px rgb(var(--mag)); }
.ch-types { display: flex; gap: 4px; }
.ch-types button { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--mute); background: rgba(255,255,255,.04); }
.ch-types svg { width: 17px; height: 17px; }
.ch-types button[aria-pressed="true"] { color: #fff; background: rgba(var(--mag),.25); box-shadow: inset 0 0 0 1px rgba(var(--mag),.7), 0 0 12px -2px rgba(var(--mag),.9); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="night" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<div id="chartPanel" hidden></div>
<script src="kit.js"></script>
<script>
const { esc, ago } = Kit;
const GLOW = { red: '255,62,110', gold: '255,196,60', cyan: '61,232,255' };
const MK = { gold: '255,200,87', usd: '61,232,255', ndq: '255,62,165' };
const WORD = { top: 'Top', world: 'World', us: 'U.S.', forex: 'Forex', tech: 'Tech/AI' };
const SUB = { top: 'what the whole world is watching', world: 'beyond the united states', us: 'politics · culture · the feed', forex: 'what moves gold, the dollar, the nasdaq', tech: 'models · chips · the frontier' };
const ICON = {
  candles: '<svg viewBox="0 0 18 18" fill="currentColor"><rect x="3" y="5" width="3" height="7" rx="1"/><rect x="4" y="2" width="1" height="14"/><rect x="11" y="7" width="3" height="6" rx="1"/><rect x="12" y="4" width="1" height="12"/></svg>',
  line: '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13l4-4 3 2 7-7"/></svg>',
  area: '<svg viewBox="0 0 18 18"><path d="M2 13l4-4 3 2 7-7v12H2z" fill="currentColor" opacity=".35"/><path d="M2 13l4-4 3 2 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  bars: '<svg viewBox="0 0 18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 3v12M3 6h2M5 12h2M13 5v10M11 8h2M13 13h2"/></svg>',
};
function card(s, i) {
  const t = Kit.thumb(s, Kit.catOf(s), 320);
  return `<a class="card" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 8) * 45}ms"><div class="ph">${Kit.img(t, '')}</div>
    <div class="tx"><div class="meta">${s.breaking ? '<span class="live">live</span>' : ''}<span class="o">${esc(s.outlet)}</span><span>${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.summary ? `<p class="sum">${esc(s.summary)}</p>` : ''}</div></a>`;
}
function fx(s, i) {
  const lv = Kit.level(s), fc = Kit.forecasts(s.fx, { w: 70, h: 15 });
  return `<a class="fx ${lv.k === 'red' ? 'pulse' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="--g:${GLOW[lv.k]};animation-delay:${Math.min(i, 8) * 45}ms">
    <div class="scope">${fc.map(f => `<div><div class="r"><span>${f.label}</span><span style="color:${f.color}">${f.dir === 'up' ? '▲' : f.dir === 'down' ? '▼' : '–'}${f.conf ? ' ' + f.conf : ''}</span></div>${f.svg}</div>`).join('')}</div>
    <div style="min-width:0"><div class="meta"><span class="lvl">${lv.tag}</span><span class="o" style="color:var(--ink2)">${esc(s.outlet)}</span><span>${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.fx?.why ? `<p class="sum">${esc(s.fx.why)}</p>` : ''}</div></a>`;
}
function rails() {
  const now = new Date();
  const ses = [['SYD', 'Australia/Sydney', 7, 16], ['TOK', 'Asia/Tokyo', 9, 18], ['LDN', 'Europe/London', 8, 17], ['NYC', 'America/New_York', 8, 17]];
  const clock = ses.map(([k, tz, o, c]) => { const h = +new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', hourCycle: 'h23' }).format(now); const t = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' }).format(now); return `<div class="${h >= o && h < c ? 'on' : ''}"><b>${t}</b>${k}</div>`; }).join('');
  return `<div class="rails">${['gold', 'usd', 'ndq'].map((k, i) => {
    const m = Kit.series(k, '1W'), up = (m.chg ?? 0) >= 0;
    return `<button class="rail" data-chart="${k}" style="--c:${MK[k]};animation-delay:${i * 60}ms"><div><div class="n">${k === 'gold' ? 'XAU · GOLD' : k === 'usd' ? 'DXY · DOLLAR' : 'IXIC · NASDAQ'}</div>
      <div class="p">${Kit.price(k, m.last)}</div><div class="c ${up ? '' : 'dn'}">${m.chg == null ? '—' : `${up ? '▲ +' : '▼ '}${m.chg.toFixed(2)}%`} <span style="color:var(--faint)">1W</span></div></div>
      ${Kit.spark(m.pts, { w: 200, h: 92, color: `rgb(${MK[k]})`, n: 80, stroke: 2, glow: 3, fillOpacity: .45, padX: 0 })}</button>`;
  }).join('')}</div><div class="clock">${clock}</div>`;
}
Kit.start({
  shell: () => `<div class="bar"><span class="logo">Brief<span>ly</span></span><span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
    <section class="mast" id="mast"></section>
    <nav class="tabs">${Kit.TABS.map((t, i) => `<button class="tab" data-tab="${t.id}"><small>0${i + 1}</small>${t.name}</button>`).join('')}</nav>
    <main id="feedArea"></main>`,
  renderTab(tab, list) {
    const ph = Kit.photo(tab, 1400, 2);
    document.getElementById('mast').innerHTML = `<div class="ph" style="background-image:url('${ph}')"></div>
      <h1 style="background-image:linear-gradient(180deg, rgba(255,255,255,.15), rgba(var(--acc),.35)), url('${ph}'), linear-gradient(120deg, rgb(var(--acc)), rgb(var(--vio)) 60%, rgb(var(--cy)))">${WORD[tab]}</h1>
      <p><b>●</b> ${list.length} stories · ${SUB[tab]}</p>`;
    const area = document.getElementById('feedArea');
    if (tab === 'forex') { area.innerHTML = rails() + `<div class="list">${list.map((s, i) => s.fx ? fx(s, i) : card(s, i)).join('')}</div>`; return; }
    if (tab === 'top' && list.length) {
      const [f, ...rest] = list, t = Kit.thumb(f, Kit.catOf(f), 1000);
      area.innerHTML = `<div class="list"><a class="lead" href="${esc(f.link)}" target="_blank" rel="noopener">${Kit.img(t, '')}<div class="in"><div class="meta">${f.breaking ? '<span class="live">live</span>' : ''}<span class="o">${esc(f.outlet)}</span><span>${ago(f.published)}</span></div><h3 class="h">${esc(f.title)}</h3></div></a>${rest.map(card).join('')}</div>`;
      return;
    }
    area.innerHTML = `<div class="list">${list.map(card).join('')}</div>`;
  },
  chartShell: () => `<div class="ch-scrim"></div><section class="ch" role="dialog" aria-label="Chart">
    <div class="ch-top"><div class="ch-assets">${Object.entries(Kit.ASSETS).map(([k]) => `<button data-asset="${k}">${k === 'gold' ? 'GOLD' : k === 'usd' ? 'DXY' : 'NDQ'}</button>`).join('')}</div><button class="ch-x" data-close aria-label="Close">✕</button></div>
    <div class="ch-name"><span data-k="name"></span> · <span data-k="sym"></span></div>
    <div class="ch-price" data-k="price"></div><div class="ch-chg" data-k="chg"></div>
    <div data-k="chart"></div>
    <div class="ch-row"><div class="ch-ranges">${Kit.RANGES.map(r => `<button data-range="${r}">${r}</button>`).join('')}</div>
    <div class="ch-types">${Kit.TYPES.map(([k, n]) => `<button data-type="${k}" aria-label="${n}">${ICON[k]}</button>`).join('')}</div></div></section>`,
  chartColors: up => ({ text: '#7f749e', grid: 'rgba(255,255,255,.05)', cross: 'rgba(255,62,165,.6)', label: '#ff3ea5', labelText: '#fff', up: '#3dffb5', down: '#ff4f8b', main: up ? '#3de8ff' : '#ff3ea5', glow: up ? '#3de8ff' : '#ff3ea5', areaTop: up ? 'rgba(61,232,255,.38)' : 'rgba(255,62,165,.38)', areaBottom: 'rgba(139,92,255,0)', mono: '"Space Mono", monospace' }),
});
</script>
</body>
</html>
