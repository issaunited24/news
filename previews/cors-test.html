<!doctype html><meta charset="utf-8"><title>Price source test</title><pre id="o">running…</pre>
<script>
// Checks which free live price sources a web page is allowed to read (used once to pick a source)
const tests = {
  ndqCandidates: ['https://scanner.tradingview.com/global/scan', { method: 'POST', body: JSON.stringify({ symbols: { tickers: ['OANDA:NAS100USD', 'PEPPERSTONE:NAS100', 'CAPITALCOM:US100', 'FOREXCOM:NSXUSD', 'NASDAQ:NDX', 'CME_MINI:NQ1!', 'TVC:NDQ', 'FX:NAS100', 'ICMARKETS:US100', 'BLACKBULL:NAS100'] }, columns: ['close', 'change', 'description'] }) }],
  oandaNasGet: ['https://scanner.tradingview.com/symbol?symbol=OANDA:NAS100USD&fields=close,change', {}],
  pepNasGet: ['https://scanner.tradingview.com/symbol?symbol=PEPPERSTONE:NAS100&fields=close,change', {}],
};
(async () => {
  const out = [];
  for (const [k, [u, o]] of Object.entries(tests)) {
    try { const t0 = performance.now(); const r = await fetch(u, o); const txt = await r.text(); out.push(`${k}: ${r.status} ${Math.round(performance.now() - t0)}ms ${txt.slice(0, 300).replace(/\s+/g, ' ')}`); }
    catch (e) { out.push(`${k}: FAIL ${e.message}`); }
  }
  document.getElementById('o').textContent = out.join('\n');
})();
</script>
