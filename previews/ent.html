<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Entertainment Cover Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter+Tight:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root { --bg: #05070f; --ink: #f4f1ea; --mute: #8e95ad; --t: 255,90,190; color-scheme: dark; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top,0px) + 24px) 16px 60px; }
h1 { margin: 0; font: 600 30px/1.1 Fraunces, Georgia, serif; letter-spacing: -.02em; }
.lede { margin: 8px 0 18px; color: var(--mute); }
.op { position: relative; isolation: isolate; height: 300px; margin: 0 0 14px; border-radius: 20px; overflow: hidden; background: #111833; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.op img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.op::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(5,7,15,.25), rgba(5,7,15,.15) 40%, rgba(5,7,15,.85)); }
.op .n { position: absolute; top: 12px; left: 12px; min-width: 32px; height: 32px; padding: 0 10px; border-radius: 999px; display: grid; place-items: center; font: 700 15px "Inter Tight", sans-serif; color: #05070f; background: #fff; }
.op .d { position: absolute; top: 18px; right: 14px; font: 500 10.5px "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.w { position: absolute; left: 10px; bottom: 18px; font: 900 60px/.84 "Inter Tight", sans-serif; letter-spacing: -.055em; text-transform: uppercase; white-space: nowrap;
  background-size: cover; background-position: center 40%; -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,.28); filter: brightness(1.5) saturate(1.2) drop-shadow(0 4px 16px rgba(0,0,0,.55)); }
.op.cur { box-shadow: 0 0 0 2px rgb(var(--t)), 0 0 20px -4px rgb(var(--t)); }
</style>
</head>
<body>
<div class="wrap">
  <h1>New Entertainment cover</h1>
  <p class="lede">Each card shows the photo behind the big ENTERTAINMENT title, the way the app shows it. Number 1 (outlined) is the one you have now. Tell me the number you like.</p>
  <div id="list"></div>
</div>
<script>
const U = (id, w, h) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&q=70&w=${w}&h=${h}`;
const OPTS = [
  ['1609924211018-5526c55bad5b', 'Now: Hollywood sign'],
  ['1536440136628-849c177e76a1', 'Neon cinema'],
  ['1595769816263-9b910be24d5f', 'Empty theater, screen glow'],
  ['1688678004647-945d5aaf91c1', 'Movie screen, dark room'],
  ['1517604931442-7e0c8ed2963c', 'Packed theater audience'],
  ['1459749411175-04bf5292ceea', 'Concert, golden lights'],
  ['1514525253161-7a46d19cd819', 'Colorful festival stage'],
  ['1524368535928-5b5e00ddc76b', 'Hands up, orange haze'],
  ['1657208431551-cbf415b8ef26', 'Teal and purple spotlights'],
  ['1546707012-c46675f12716', 'Arena, blue stage light'],
  ['1702890764798-eda71e941da1', 'Film festival marquee'],
];
const list = document.getElementById('list');
list.innerHTML = OPTS.map(([id, d], i) => `<div class="op${i === 0 ? ' cur' : ''}"><img src="${U(id, 900, 600)}" alt="${d}" loading="${i < 3 ? 'eager' : 'lazy'}"><span class="n">${i + 1}</span><span class="d">${d}</span>
  <div class="w" style="background-image:linear-gradient(180deg, rgba(255,255,255,.34), rgba(var(--t),.26)), url('${U(id, 900, 300)}'), linear-gradient(120deg, rgb(var(--t)), #fff 60%, rgb(var(--t)))">Entertainment</div></div>`).join('');
function fit() { for (const w of document.querySelectorAll('.w')) { w.style.fontSize = '60px'; const max = w.parentElement.clientWidth - 22; const cur = w.getBoundingClientRect().width; if (cur > max) w.style.fontSize = Math.floor(60 * max / cur) + 'px'; } }
fit(); document.fonts?.ready?.then(fit); addEventListener('resize', fit);
</script>
</body>
</html>
