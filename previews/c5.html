<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081022">
<title>Briefly · Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Atlas: a private-bank newspaper. Midnight navy, champagne light, serif numerals, calm and expensive. */
:root {
  --bg: #081022; --bg2: #0d1730; --ink: #f3efe6; --ink2: #cdd3e3; --mute: #8b94ae; --faint: #4e5874; --line: rgba(217,178,111,.16);
  --ch: 217,178,111;
  --serif: "DM Serif Display", Georgia, serif; --ui: "DM Sans", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, monospace;
  --up: #46e3a6; --down: #ff6f86;
  color-scheme: dark;
}
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.amb { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(70% 40% at 50% 0%, rgba(var(--ch),.10), transparent 70%), radial-gradient(60% 40% at 100% 70%, rgba(60,110,220,.14), transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(40,70,160,.2), transparent 70%), linear-gradient(180deg, #0a1328, #081022); }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

.mast { text-align: center; padding: calc(env(safe-area-inset-top,0px) + 16px) 18px 10px; }
.mast .date { font: 500 10px var(--mono); letter-spacing: .24em; color: var(--mute); text-transform: uppercase; }
.mast .logo { margin-top: 4px; font: 400 34px/1 var(--serif); letter-spacing: -.01em; }
.mast .logo i { color: rgb(var(--ch)); }
.rule { height: 1px; margin: 12px auto 0; width: 64px; background: linear-gradient(90deg, transparent, rgb(var(--ch)), transparent); }
.tabs { position: sticky; top: 0; z-index: 10; display: flex; justify-content: safe center; gap: 20px; padding: calc(env(safe-area-inset-top,0px) + 10px) 18px 10px; overflow-x: auto; scrollbar-width: none;
  background: rgba(8,16,34,.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 1px 0 var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; flex: none; padding: 4px 0; font: 400 17px var(--serif); color: var(--mute); transition: color .3s; }
.tab::after { content: ""; position: absolute; left: 50%; bottom: -2px; width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--ch)); box-shadow: 0 0 10px rgb(var(--ch)); transform: translateX(-50%) scale(0); transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
.tab[aria-selected="true"] { color: var(--ink); } .tab[aria-selected="true"]::after { transform: translateX(-50%) scale(1); }

/* category plate */
.plate { position: relative; margin: 14px 14px 0; height: 168px; border-radius: 22px; overflow: hidden; background: var(--bg2); box-shadow: inset 0 0 0 1px var(--line), 0 24px 40px -28px #000; }
.plate img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.85) contrast(1.05); animation: settle 1.2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes settle { from { transform: scale(1.1); opacity: 0; } }
.plate::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,16,34,.92) 0%, rgba(8,16,34,.55) 50%, rgba(8,16,34,.1)), linear-gradient(0deg, rgba(var(--ch),.12), transparent 50%); }
.plate .t { position: absolute; z-index: 1; left: 20px; top: 50%; transform: translateY(-50%); max-width: 62%; }
.plate .k { font: 500 9.5px var(--mono); letter-spacing: .24em; color: rgb(var(--ch)); text-transform: uppercase; }
.plate h1 { margin: 6px 0 0; font: 400 32px/1.02 var(--serif); }
.plate p { margin: 6px 0 0; font-size: 12.5px; color: var(--ink2); }

/* stories */
.list { padding: 6px 18px 60px; }
.st { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); animation: show .6s cubic-bezier(.2,.8,.2,1) both; }
.st:last-child { border-bottom: 0; }
.st .im { position: relative; width: 78px; height: 78px; border-radius: 14px; overflow: hidden; background: var(--bg2); box-shadow: 0 0 0 1px rgba(255,255,255,.05); }
.st .im img { width: 100%; height: 100%; object-fit: cover; }
.st .im b { position: absolute; left: 6px; bottom: 4px; font: 400 22px/1 var(--serif); color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
@keyframes show { from { opacity: 0; transform: translateY(10px); } }
.meta { display: flex; align-items: center; gap: 8px; font: 600 10px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); min-width: 0; }
.meta .o { color: rgb(var(--ch)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h { margin: 5px 0 0; font: 400 18px/1.22 var(--serif); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum { margin: 5px 0 0; font-size: 13px; line-height: 1.45; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live { color: #fff; background: #d63a55; padding: 1px 6px; border-radius: 4px; letter-spacing: .08em; }
/* Top: the front page */
.front { display: block; margin: 14px 14px 4px; border-radius: 24px; overflow: hidden; background: var(--bg2); box-shadow: inset 0 0 0 1px var(--line), 0 30px 50px -30px #000; animation: show .6s both; }
.front .im { position: relative; height: 230px; } .front .im img { width: 100%; height: 100%; object-fit: cover; }
.front .im::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, var(--bg2)); }
.front .tx { padding: 0 18px 18px; margin-top: -26px; position: relative; }
.front .h { font-size: 25px; line-height: 1.12; -webkit-line-clamp: 4; }

/* Forex: the portfolio */
.port { margin: 14px 14px 0; padding: 6px; border-radius: 26px; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.1), 0 30px 50px -30px #000; }
.port h2 { display: flex; justify-content: space-between; margin: 8px 12px 6px; font: 500 10px var(--mono); letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }
.pos { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr) 96px auto; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 20px; text-align: left; overflow: hidden; transition: background .25s; animation: show .5s both; }
.pos + .pos { margin-top: 2px; }
.pos::before { content: ""; position: absolute; inset: 0; border-radius: 20px; background: radial-gradient(60% 120% at 0% 50%, rgba(var(--c),.16), transparent 70%); box-shadow: inset 0 0 0 1px rgba(var(--c),.22); }
.pos:active { background: rgba(255,255,255,.04); }
.pos .ic { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 400 16px var(--serif); color: #0a1226; background: radial-gradient(circle at 35% 30%, #fff, rgb(var(--c)) 55%); box-shadow: 0 0 18px rgba(var(--c),.55); }
.pos .nm { position: relative; font: 600 14px var(--ui); } .pos .sy { position: relative; font: 400 10.5px var(--mono); color: var(--mute); }
.pos svg { position: relative; width: 96px; height: 38px; display: block; }
.pos .rt { position: relative; text-align: right; }
.pos .pr { font: 400 19px/1 var(--serif); font-variant-numeric: tabular-nums; }
.pos .cg { display: inline-block; margin-top: 5px; padding: 2px 7px; border-radius: 999px; font: 500 10.5px var(--mono); color: var(--up); background: rgba(70,227,166,.12); }
.pos .cg.dn { color: var(--down); background: rgba(255,111,134,.12); }
.brief { display: flex; gap: 8px; margin: 10px 14px 0; }
.brief div { flex: 1; padding: 11px 13px; border-radius: 18px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); font-size: 12.5px; color: var(--ink2); }
.brief b { display: block; font: 500 9.5px var(--mono); letter-spacing: .2em; color: rgb(var(--ch)); margin-bottom: 3px; }
/* Forex news */
.fx { position: relative; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 14px; margin: 12px 0 0; padding: 12px 14px 12px 12px; border-radius: 20px;
  background: linear-gradient(90deg, rgba(var(--g),.10), transparent 55%), rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(var(--g),.32), 0 0 24px -8px rgba(var(--g),.55); animation: show .6s both; }
.fx.pulse { animation: show .6s both, breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: inset 0 0 0 1px rgba(var(--g),.6), 0 0 34px -6px rgba(var(--g),.8); } }
.lg { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 14px; background: rgba(4,9,22,.7); align-self: start; }
.lg div { font: 400 8.5px var(--mono); color: var(--mute); } .lg .r { display: flex; justify-content: space-between; }
.lg svg { width: 100%; height: 15px; display: block; }
.lvl { padding: 2px 7px; border-radius: 999px; color: rgb(var(--g)); background: rgba(var(--g),.12); box-shadow: 0 0 12px -2px rgba(var(--g),.7), inset 0 0 0 1px rgba(var(--g),.4); letter-spacing: .1em; }

/* chart sheet */
#chartPanel { position: fixed; inset: 0; z-index: 40; }
.ch-scrim { position: absolute; inset: 0; background: rgba(4,8,18,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .35s; }
.ch { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; padding: 10px 18px calc(16px + env(safe-area-inset-bottom,0px)); border-radius: 30px 30px 0 0;
  background: radial-gradient(80% 60% at 50% 0%, rgba(var(--ch),.12), transparent 70%), linear-gradient(180deg, #111d3a, #0a1328); box-shadow: inset 0 1px 0 rgba(var(--ch),.35), 0 -30px 60px -20px rgba(0,0,0,.8);
  transform: translateY(100%); transition: transform .5s cubic-bezier(.2,.9,.2,1); }
#chartPanel.open .ch-scrim { opacity: 1; } #chartPanel.open .ch { transform: none; }
.ch > * { opacity: 0; transform: translateY(10px); transition: .4s; }
#chartPanel.open .ch > * { opacity: 1; transform: none; }
#chartPanel.open .ch > :nth-child(2) { transition-delay: .08s; } #chartPanel.open .ch > :nth-child(3) { transition-delay: .12s; } #chartPanel.open .ch > :nth-child(4) { transition-delay: .16s; } #chartPanel.open .ch > :nth-child(5) { transition-delay: .2s; } #chartPanel.open .ch > :nth-child(6) { transition-delay: .24s; }
.ch-grab { width: 40px; height: 4px; border-radius: 2px; margin: 0 auto 10px; background: rgba(255,255,255,.18); }
.ch-assets { display: grid; grid-template-columns: repeat(3, 1fr); margin-right: 44px; padding: 3px; border-radius: 13px; background: rgba(255,255,255,.05); }
.ch-assets button { height: 32px; border-radius: 10px; font: 600 12.5px var(--ui); color: var(--mute); transition: .25s; }
.ch-assets button[aria-pressed="true"] { color: #0a1226; background: linear-gradient(180deg, #f1dcb2, rgb(var(--ch))); box-shadow: 0 4px 14px -4px rgba(var(--ch),.7); }
.ch-hd { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 16px; gap: 10px; }
.ch-name { font: 600 10px var(--mono); letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }
.ch-price { margin-top: 4px; font: 400 40px/1 var(--serif); font-variant-numeric: tabular-nums; }
.ch-chg { font: 500 12px var(--mono); color: var(--up); text-align: right; } .ch-chg.dn { color: var(--down); } .ch-chg span { display: block; color: var(--mute); margin-top: 2px; } .ch-chg .ch-time { display: inline; color: var(--ink2); }
.ch-x { position: absolute; right: 16px; top: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: var(--ink2); font-size: 12px; }
[data-k=chart] { height: 220px; margin: 14px -4px 10px; }
.ch-msg { display: grid; place-items: center; height: 100%; color: var(--mute); font-size: 13px; }
.ch-ranges { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.ch-ranges button { height: 34px; border-radius: 10px; font: 500 12px var(--mono); color: var(--mute); }
.ch-ranges button[aria-pressed="true"] { color: var(--ink); background: rgba(var(--ch),.16); box-shadow: inset 0 0 0 1px rgba(var(--ch),.45); }
.ch-types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.ch-types button { height: 36px; border-radius: 12px; font: 500 12.5px var(--ui); color: var(--mute); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.ch-types button[aria-pressed="true"] { color: var(--ink); background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="amb" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<div id="chartPanel" hidden></div>
<script src="kit.js"></script>
<script>
const { esc, ago } = Kit;
const GLOW = { red: '255,82,110', gold: '240,190,90', cyan: '90,210,255' };
const MK = { gold: ['230,190,110', 'Au'], usd: ['110,200,255', '$'], ndq: ['200,120,255', 'N'] };
const PLATE = {
  top: ['Front page', 'The day’s defining stories', 'Only what the whole world will remember.'],
  world: ['Foreign desk', 'The world', 'Capitals, conflicts and catastrophes abroad.'],
  us: ['National desk', 'United States', 'Washington first, then the culture.'],
  forex: ['Markets desk', 'Gold, dollar &amp; Nasdaq', 'What will move them, and which way.'],
  tech: ['Technology desk', 'Tech &amp; AI', 'Models, chips and the companies behind them.'],
};
function st(s, i, num) {
  const t = Kit.thumb(s, Kit.catOf(s), 240);
  return `<a class="st" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 8) * 45}ms"><div class="im">${Kit.img(t, '')}${num ? `<b>${num}</b>` : ''}</div>
    <div style="min-width:0"><div class="meta">${s.breaking ? '<span class="live">Live</span>' : ''}<span class="o">${esc(s.outlet)}</span><span>${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.summary ? `<p class="sum">${esc(s.summary)}</p>` : ''}</div></a>`;
}
function fx(s, i) {
  const lv = Kit.level(s), fc = Kit.forecasts(s.fx, { w: 70, h: 15 });
  return `<a class="fx ${lv.k === 'red' ? 'pulse' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="--g:${GLOW[lv.k]};animation-delay:${Math.min(i, 8) * 45}ms">
    <div class="lg">${fc.map(f => `<div><div class="r"><span>${f.label}</span><span style="color:${f.color}">${f.dir === 'up' ? '▲' : f.dir === 'down' ? '▼' : '–'} ${f.conf || ''}</span></div>${f.svg}</div>`).join('')}</div>
    <div style="min-width:0"><div class="meta"><span class="lvl">${lv.tag}</span><span class="o" style="color:var(--ink2)">${esc(s.outlet)}</span><span>${ago(s.published)}</span></div>
    <h3 class="h" style="font-size:17px">${esc(s.title)}</h3>${s.fx?.why ? `<p class="sum">${esc(s.fx.why)}</p>` : ''}</div></a>`;
}
function portfolio() {
  const rows = ['gold', 'usd', 'ndq'].map((k, i) => {
    const m = Kit.series(k, '1W'), up = (m.chg ?? 0) >= 0, [c, ic] = MK[k];
    return `<button class="pos" data-chart="${k}" style="--c:${c};animation-delay:${i * 60}ms"><span class="ic">${ic}</span>
      <div style="position:relative;min-width:0"><div class="nm">${k === 'usd' ? 'US Dollar' : Kit.ASSETS[k].name}</div><div class="sy">${Kit.ASSETS[k].sym}</div></div>
      ${Kit.spark(m.pts, { w: 96, h: 38, color: `rgb(${c})`, n: 60, stroke: 1.6, glow: 2, fillOpacity: .4, padX: 0, dotR: 1.8 })}
      <div class="rt"><div class="pr">${Kit.price(k, m.last)}</div><span class="cg ${up ? '' : 'dn'}">${m.chg == null ? '—' : `${up ? '+' : ''}${m.chg.toFixed(2)}%`}</span></div></button>`;
  }).join('');
  const ev = (Kit.data?.calendar?.events || []).map(e => ({ ...e, t: Date.parse(e.time) })).filter(e => e.impact === 'high' && e.t > Date.now()).sort((a, b) => a.t - b.t)[0];
  const ny = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date());
  return `<section class="port"><h2><span>Your markets</span><span>1 week · tap to chart</span></h2>${rows}</section>
    <div class="brief"><div><b>NEXT EVENT</b>${ev ? `${esc(ev.title)}, ${new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(ev.t)}` : 'Nothing major left this week'}</div><div><b>NEW YORK</b>${ny >= 8 && ny < 17 ? 'Session open' : 'Session closed'}</div></div>`;
}
Kit.start({
  shell: () => `<header class="mast"><div class="date">${new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date())}</div><div class="logo">Brief<i>ly</i></div><div class="rule"></div></header>
    <nav class="tabs">${Kit.TABS.map(t => `<button class="tab" data-tab="${t.id}">${t.name}</button>`).join('')}</nav><main id="feedArea"></main>`,
  renderTab(tab, list) {
    const [k, h, p] = PLATE[tab];
    const plate = `<section class="plate"><img src="${Kit.photo(tab, 1100, 3)}" alt=""><div class="t"><div class="k">${k} · ${list.length}</div><h1>${h}</h1><p>${p}</p></div></section>`;
    const area = document.getElementById('feedArea');
    if (tab === 'forex') { area.innerHTML = portfolio() + `<div class="list" style="padding-top:2px">${list.map((s, i) => s.fx ? fx(s, i) : st(s, i)).join('')}</div>`; return; }
    if (tab === 'top' && list.length) {
      const [f, ...rest] = list, t = Kit.thumb(f, Kit.catOf(f), 1000);
      area.innerHTML = `<a class="front" href="${esc(f.link)}" target="_blank" rel="noopener"><div class="im">${Kit.img(t, '')}</div><div class="tx"><div class="meta">${f.breaking ? '<span class="live">Live</span>' : ''}<span class="o">${esc(f.outlet)}</span><span>${ago(f.published)}</span></div><h3 class="h">${esc(f.title)}</h3>${f.summary ? `<p class="sum">${esc(f.summary)}</p>` : ''}</div></a>
        <div class="list">${rest.map((s, i) => st(s, i, i + 2)).join('')}</div>`;
      return;
    }
    area.innerHTML = plate + `<div class="list">${list.map((s, i) => st(s, i)).join('')}</div>`;
  },
  chartShell: () => `<div class="ch-scrim"></div><section class="ch" role="dialog" aria-label="Chart"><div class="ch-grab"></div>
    <div class="ch-assets">${Object.entries(Kit.ASSETS).map(([k]) => `<button data-asset="${k}">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar' : 'Nasdaq'}</button>`).join('')}</div>
    <div class="ch-hd"><div><div class="ch-name"><span data-k="name"></span> · <span data-k="sym"></span></div><div class="ch-price" data-k="price"></div></div><div class="ch-chg" data-k="chg"></div></div>
    <div data-k="chart"></div>
    <div class="ch-ranges">${Kit.RANGES.map(r => `<button data-range="${r}">${r}</button>`).join('')}</div>
    <div class="ch-types">${Kit.TYPES.map(([k, n]) => `<button data-type="${k}">${n}</button>`).join('')}</div>
    <button class="ch-x" data-close aria-label="Close">✕</button></section>`,
  chartColors: up => ({ text: '#7d86a0', grid: 'rgba(217,178,111,.08)', cross: 'rgba(217,178,111,.6)', label: '#d9b26f', labelText: '#0a1226', up: '#46e3a6', down: '#ff6f86', main: up ? '#e8c27c' : '#ff6f86', glow: up ? 'rgba(232,194,124,.8)' : '#ff6f86', areaTop: up ? 'rgba(217,178,111,.32)' : 'rgba(255,111,134,.3)', areaBottom: 'rgba(217,178,111,0)', mono: '"DM Mono", monospace' }),
});
</script>
</body>
</html>
