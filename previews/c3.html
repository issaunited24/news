<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#041019">
<title>Briefly · Abyss</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Abyss: deep-sea navy and teal, bioluminescent light, a floating dock, the photo framed like a window */
:root {
  --bg: #041019; --ink: #eafcff; --ink2: #b9d4dc; --mute: #7d9aa6; --faint: #4c6772;
  --a: 46,232,214; --b: 70,140,255;
  --ui: Outfit, system-ui, sans-serif; --mono: "DM Mono", ui-monospace, monospace;
  --up: #39f2b6; --down: #ff6a8d;
  color-scheme: dark;
}
body[data-view=top] { --a: 46,232,214; --b: 70,140,255; } body[data-view=world] { --a: 90,200,255; --b: 40,90,200; }
body[data-view=us] { --a: 120,150,255; --b: 255,90,130; } body[data-view=forex] { --a: 46,232,214; --b: 255,200,90; } body[data-view=tech] { --a: 150,120,255; --b: 46,232,214; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.sea { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: radial-gradient(120% 70% at 50% -10%, #0b2638, #041019 60%), #041019; }
.orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; transition: background 1.2s; }
.orb.o1 { width: 70vw; height: 70vw; left: -20vw; top: 10vh; background: rgba(var(--a),.35); animation: float 16s ease-in-out infinite alternate; }
.orb.o2 { width: 60vw; height: 60vw; right: -25vw; top: 55vh; background: rgba(var(--b),.3); animation: float 20s ease-in-out infinite alternate-reverse; }
@keyframes float { to { transform: translate3d(8vw, -6vh, 0) scale(1.1); } }
.motes { position: absolute; inset: 0; background-image: radial-gradient(1.2px 1.2px at 20% 30%, rgba(var(--a),.7), transparent), radial-gradient(1px 1px at 70% 60%, rgba(var(--a),.6), transparent), radial-gradient(1.4px 1.4px at 40% 80%, rgba(var(--a),.5), transparent), radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,.5), transparent); background-size: 300px 400px; animation: rise 40s linear infinite; opacity: .6; }
@keyframes rise { to { background-position: 0 -800px; } }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-bottom: 120px; }

.head { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 12px; }
.logo { display: flex; align-items: center; gap: 8px; font: 600 20px var(--ui); letter-spacing: -.02em; }
.logo b { width: 22px; height: 22px; border-radius: 8px; background: radial-gradient(circle at 30% 30%, #fff, rgb(var(--a)) 40%, rgb(var(--b))); box-shadow: 0 0 18px rgba(var(--a),.8); transition: .8s; }
.upd { margin-left: auto; font: 400 11px var(--mono); color: var(--mute); }

/* the window */
.win { position: relative; margin: 0 14px; height: 210px; border-radius: 30px; overflow: hidden; background: #0a2232;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 0 0 6px rgba(var(--a),.05), 0 30px 60px -30px rgba(var(--a),.55); }
.win img { position: absolute; inset: 0; width: 100%; height: 115%; object-fit: cover; transform: translateY(calc(var(--s,0) * -40px)); animation: fade .9s ease both; }
@keyframes fade { from { opacity: 0; transform: scale(1.06); } }
.win::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,16,25,.1), rgba(4,16,25,.25) 40%, rgba(4,16,25,.9)), radial-gradient(80% 70% at 100% 100%, rgba(var(--a),.35), transparent 60%); mix-blend-mode: normal; }
.win .t { position: absolute; z-index: 1; left: 20px; right: 20px; bottom: 18px; }
.win h1 { margin: 0; font: 600 36px/1 var(--ui); letter-spacing: -.03em; }
.win p { margin: 6px 0 0; font: 400 12px var(--mono); color: var(--ink2); }
.win .cnt { position: absolute; z-index: 1; top: 16px; right: 16px; padding: 5px 10px; border-radius: 999px; font: 500 11px var(--mono); background: rgba(4,16,25,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }

/* cards */
.list { display: flex; flex-direction: column; gap: 12px; padding: 16px 14px 0; }
.card { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: start; padding: 12px; border-radius: 26px;
  background: linear-gradient(145deg, rgba(var(--a),.07), rgba(255,255,255,.02) 50%), rgba(8,26,38,.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 18px 30px -24px #000; animation: in .55s cubic-bezier(.2,.8,.2,1) both; transition: transform .2s; }
.card:active { transform: scale(.985); }
.im { width: 84px; height: 84px; border-radius: 22px; overflow: hidden; background: #0c2a3a; box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 10px 20px -10px #000; }
.im img { width: 100%; height: 100%; object-fit: cover; }
.meta { display: flex; align-items: center; gap: 7px; font: 400 11px var(--mono); color: var(--mute); min-width: 0; }
.meta .o { color: rgb(var(--a)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h { margin: 4px 0 0; font: 600 16px/1.27 var(--ui); letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum { margin: 4px 0 0; font-size: 13px; line-height: 1.4; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live { font: 500 10px var(--mono); padding: 2px 7px; border-radius: 999px; color: #fff; background: #ff3d6a; box-shadow: 0 0 12px rgba(255,61,106,.7); }
@keyframes in { from { opacity: 0; transform: translateY(16px) scale(.98); } }
/* Top: a featured card */
.feat { display: block; position: relative; height: 300px; border-radius: 28px; overflow: hidden; animation: in .55s both; box-shadow: 0 30px 40px -30px #000, inset 0 0 0 1px rgba(255,255,255,.08); }
.feat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.feat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(4,16,25,.95)); }
.feat .in { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; }
.feat .h { font-size: 22px; line-height: 1.18; }

/* Forex: three luminous columns */
.mk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 16px 14px 0; }
.mc { display: flex; flex-direction: column; align-items: flex-start; position: relative; padding: 12px 10px 0; border-radius: 22px; overflow: hidden; text-align: left; min-height: 178px;
  background: linear-gradient(180deg, rgba(var(--c),.16), rgba(var(--c),.03) 60%), rgba(8,26,38,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 0 0 1px rgba(var(--c),.32), inset 0 1px 0 rgba(255,255,255,.15), 0 0 30px -8px rgba(var(--c),.6); animation: in .55s both; transition: transform .2s; }
.mc:active { transform: scale(.97); }
.mc .n { font: 500 10.5px var(--mono); color: rgb(var(--c)); letter-spacing: .06em; text-shadow: 0 0 10px rgba(var(--c),.8); }
.mc .p { margin-top: 8px; font: 600 19px/1 var(--ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mc .c { margin-top: 5px; font: 500 11px var(--mono); color: var(--up); } .mc .c.dn { color: var(--down); }
.mc svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 62px; }
.mc .ring { position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--c),.45), transparent 65%); }
.tide { display: flex; align-items: center; gap: 10px; margin: 10px 14px 0; padding: 12px 14px; border-radius: 20px; background: rgba(8,26,38,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); font-size: 12.5px; color: var(--ink2); }
.tide .bar { position: relative; flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
.tide .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, rgb(var(--a)), rgb(var(--b))); box-shadow: 0 0 10px rgb(var(--a)); }
.tide .bar u { position: absolute; top: -3px; width: 2px; height: 12px; background: #fff; box-shadow: 0 0 8px #fff; }
.tide b { font: 500 11px var(--mono); color: var(--mute); }
/* Forex news: bioluminescent importance */
.fx { position: relative; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: 26px;
  background: radial-gradient(100% 120% at 0% 0%, rgba(var(--g),.2), transparent 55%), rgba(8,26,38,.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 0 0 1px rgba(var(--g),.35), 0 0 26px -6px rgba(var(--g),.55), 0 0 70px -24px rgba(var(--g),.5); animation: in .55s both; }
.fx.pulse { animation: in .55s both, glow 3s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 1px rgba(var(--g),.6), 0 0 34px -4px rgba(var(--g),.8), 0 0 90px -20px rgba(var(--g),.7); } }
.pod { display: flex; flex-direction: column; justify-content: space-between; gap: 4px; height: 100%; min-height: 84px; padding: 8px 8px; border-radius: 20px; background: rgba(2,10,16,.6); }
.pod > div { display: flex; align-items: center; gap: 4px; font: 500 8.5px var(--mono); color: var(--mute); }
.pod svg { flex: 1; height: 14px; min-width: 0; }
.pod em { font-style: normal; width: 12px; text-align: right; }
.lvl { display: inline-flex; align-items: center; gap: 5px; font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: rgb(var(--g)); }
.lvl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--g)); box-shadow: 0 0 10px rgb(var(--g)); }

/* the dock */
.dock { position: fixed; z-index: 20; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom,0px)); transform: translateX(-50%); display: flex; gap: 2px; padding: 6px; border-radius: 28px; width: min(calc(100% - 24px), 440px);
  background: rgba(6,22,32,.72); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 1px 0 rgba(255,255,255,.12), 0 20px 40px -10px #000, 0 0 40px -20px rgba(var(--a),.6); }
.tab { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 22px; font: 500 10.5px var(--ui); color: var(--mute); transition: color .3s; }
.tab svg { width: 20px; height: 20px; position: relative; z-index: 1; } .tab span { position: relative; z-index: 1; }
.tab::before { content: ""; position: absolute; inset: 0; border-radius: 22px; background: radial-gradient(70% 70% at 50% 40%, rgba(var(--a),.35), rgba(var(--a),.08) 70%); box-shadow: inset 0 0 0 1px rgba(var(--a),.35); opacity: 0; transform: scale(.7); transition: .35s cubic-bezier(.2,.9,.3,1.3); }
.tab[aria-selected="true"] { color: var(--ink); } .tab[aria-selected="true"]::before { opacity: 1; transform: none; }
.tab[aria-selected="true"] svg { filter: drop-shadow(0 0 6px rgb(var(--a))); }

/* chart: a floating card that blooms from the centre */
#chartPanel { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; justify-items: center; padding: 12px 12px calc(12px + env(safe-area-inset-bottom,0px)); }
.ch-scrim { position: absolute; inset: 0; background: rgba(2,8,14,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .3s; }
.ch { position: relative; width: 100%; max-width: 520px; padding: 16px; border-radius: 32px; opacity: 0; transform: translateY(40px) scale(.92); transform-origin: 50% 100%;
  transition: transform .5s cubic-bezier(.25,1.3,.4,1), opacity .25s;
  background: radial-gradient(120% 80% at 0% 0%, rgba(var(--a),.2), transparent 50%), radial-gradient(100% 80% at 100% 100%, rgba(var(--b),.14), transparent 55%), rgba(6,22,32,.96);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 1px 0 rgba(255,255,255,.14), 0 0 60px -20px rgba(var(--a),.7), 0 40px 60px -20px #000; }
#chartPanel.open .ch-scrim { opacity: 1; } #chartPanel.open .ch { opacity: 1; transform: none; }
.ch-head { display: flex; align-items: center; gap: 12px; }
.ch-ico { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font: 600 15px var(--ui); color: #031015; background: radial-gradient(circle at 30% 30%, #fff, rgb(var(--a)) 45%); box-shadow: 0 0 18px rgba(var(--a),.7); }
.ch-name { font: 600 16px var(--ui); } .ch-sym { font: 400 11px var(--mono); color: var(--mute); }
.ch-x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.07); color: var(--ink2); }
.ch-pr { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.ch-price { font: 600 34px/1 var(--ui); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ch-chg { font: 500 12px var(--mono); color: var(--up); padding: 3px 8px; border-radius: 999px; background: rgba(57,242,182,.12); } .ch-chg.dn { color: var(--down); background: rgba(255,106,141,.12); } .ch-chg span { color: var(--mute); margin-left: 4px; } .ch-chg .ch-time { color: var(--ink2); margin: 0; }
.ch-assets { display: none; }
[data-k=chart] { height: 220px; margin: 12px -4px 10px; }
.ch-msg { display: grid; place-items: center; height: 100%; color: var(--mute); font-size: 13px; }
.ch-ranges, .ch-types { position: relative; display: grid; padding: 4px; border-radius: 18px; background: rgba(255,255,255,.05); }
.ch-ranges { grid-template-columns: repeat(6, minmax(0, 1fr)); } .ch-types { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 8px; }
.ch-ranges button, .ch-types button { height: 34px; border-radius: 14px; font: 500 12px var(--ui); color: var(--mute); transition: .25s; }
.ch-ranges button[aria-pressed="true"], .ch-types button[aria-pressed="true"] { color: #031015; background: linear-gradient(180deg, #fff, rgb(var(--a))); box-shadow: 0 0 16px rgba(var(--a),.6); }
.ch-swap { display: flex; gap: 6px; margin-top: 12px; }
.ch-swap button { flex: 1; height: 38px; border-radius: 14px; font: 500 12px var(--ui); color: var(--mute); background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.ch-swap button[aria-pressed="true"] { color: var(--ink); background: rgba(var(--a),.14); box-shadow: inset 0 0 0 1px rgba(var(--a),.45); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="sea" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="motes"></div></div>
<div class="wrap" id="app"></div>
<div id="chartPanel" hidden></div>
<script src="kit.js"></script>
<script>
const { esc, ago } = Kit;
const GLOW = { red: '255,70,110', gold: '255,196,72', cyan: '60,220,255' };
const MK = { gold: '255,200,87', usd: '60,220,255', ndq: '255,92,200' };
const IC = {
  top: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  world: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  us: '<path d="M4 21V4M4 4h13l-2 4 2 4H4"/>',
  forex: '<path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/>',
  tech: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
};
const SUB = { top: 'The biggest stories on earth', world: 'Everything beyond the U.S.', us: 'Politics, culture, the feed', forex: 'What moves gold, the dollar and the Nasdaq', tech: 'AI, chips and the frontier' };
addEventListener('scroll', () => document.body.style.setProperty('--s', Math.min(1, scrollY / 300).toFixed(2)), { passive: true });

function card(s, i) {
  const t = Kit.thumb(s, Kit.catOf(s), 240);
  return `<a class="card" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 8) * 45}ms"><div class="im">${Kit.img(t, '')}</div>
    <div style="min-width:0"><div class="meta">${s.breaking ? '<span class="live">live</span>' : ''}<span class="o">${esc(s.outlet)}</span><span>· ${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.summary ? `<p class="sum">${esc(s.summary)}</p>` : ''}</div></a>`;
}
function fx(s, i) {
  const lv = Kit.level(s), fc = Kit.forecasts(s.fx, { w: 50, h: 14 });
  return `<a class="fx ${lv.k === 'red' ? 'pulse' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="--g:${GLOW[lv.k]};animation-delay:${Math.min(i, 8) * 45}ms">
    <div class="pod">${fc.map(f => `<div><span style="width:24px">${f.label}</span>${f.svg}<em style="color:${f.color}">${f.conf || '·'}</em></div>`).join('')}</div>
    <div style="min-width:0"><div class="meta"><span class="lvl">${lv.tag}</span><span class="o" style="color:var(--ink2)">${esc(s.outlet)}</span><span>· ${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.fx?.why ? `<p class="sum">${esc(s.fx.why)}</p>` : ''}</div></a>`;
}
function markets() {
  const cards = ['gold', 'usd', 'ndq'].map((k, i) => {
    const m = Kit.series(k, '1W'), up = (m.chg ?? 0) >= 0;
    return `<button class="mc" data-chart="${k}" style="--c:${MK[k]};animation-delay:${i * 60}ms"><span class="ring"></span>
      <div class="n">${k === 'gold' ? 'GOLD' : k === 'usd' ? 'DXY' : 'NASDAQ'}</div><div class="p">${Kit.price(k, m.last)}</div>
      <div class="c ${up ? '' : 'dn'}">${m.chg == null ? '—' : `${up ? '+' : ''}${m.chg.toFixed(2)}%`} <span style="color:var(--faint)">1W</span></div>
      ${Kit.spark(m.pts, { w: 120, h: 62, color: `rgb(${MK[k]})`, n: 60, stroke: 1.8, glow: 2.4, fillOpacity: .55, padX: 0, dotR: 2 })}</button>`;
  }).join('');
  // where we are in the US trading day (9:30–16:00 New York)
  const ny = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
  const mins = +ny.find(p => p.type === 'hour').value * 60 + +ny.find(p => p.type === 'minute').value;
  const pos = Math.max(0, Math.min(100, mins / 1440 * 100));
  return `<div class="mk">${cards}</div><div class="tide"><b>NY</b><div class="bar"><i style="left:${570 / 14.4}%;width:${390 / 14.4}%"></i><u style="left:${pos}%"></u></div><b>${mins >= 570 && mins < 960 ? 'Wall St open' : 'Wall St closed'}</b></div>`;
}
Kit.start({
  shell: () => `<header class="head"><span class="logo"><b></b>Briefly</span><span class="upd" id="upd"></span></header><main id="feedArea"></main>
    <nav class="dock">${Kit.TABS.map(t => `<button class="tab" data-tab="${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[t.id]}</svg><span>${t.id === 'tech' ? 'Tech' : t.name}</span></button>`).join('')}</nav>`,
  renderTab(tab, list) {
    document.getElementById('upd').textContent = Kit.data ? `updated ${ago(Kit.data.updated)} ago` : '';
    const win = `<section class="win"><img src="${Kit.photo(tab, 1100, 1)}" alt=""><span class="cnt">${list.length} stories</span><div class="t"><h1>${Kit.catName(tab)}</h1><p>${SUB[tab]}</p></div></section>`;
    const area = document.getElementById('feedArea');
    if (tab === 'forex') { area.innerHTML = win + markets() + `<div class="list">${list.map((s, i) => s.fx ? fx(s, i) : card(s, i)).join('')}</div>`; return; }
    if (tab === 'top' && list.length) {
      const [f, ...rest] = list, t = Kit.thumb(f, Kit.catOf(f), 1000);
      area.innerHTML = `<div class="list" style="padding-top:0"><a class="feat" href="${esc(f.link)}" target="_blank" rel="noopener">${Kit.img(t, '')}<div class="in"><div class="meta">${f.breaking ? '<span class="live">live</span>' : ''}<span class="o">${esc(f.outlet)}</span><span>· ${ago(f.published)}</span></div><h3 class="h">${esc(f.title)}</h3></div></a>${rest.map(card).join('')}</div>`;
      return;
    }
    area.innerHTML = win + `<div class="list">${list.map(card).join('')}</div>`;
  },
  chartShell: () => `<div class="ch-scrim"></div><section class="ch" role="dialog" aria-label="Chart">
    <div class="ch-head"><span class="ch-ico" id="chIco">Au</span><div><div class="ch-name" data-k="name"></div><div class="ch-sym" data-k="sym"></div></div><button class="ch-x" data-close aria-label="Close">✕</button></div>
    <div class="ch-pr"><span class="ch-price" data-k="price"></span><span class="ch-chg" data-k="chg"></span></div>
    <div data-k="chart"></div>
    <div class="ch-ranges">${Kit.RANGES.map(r => `<button data-range="${r}">${r}</button>`).join('')}</div>
    <div class="ch-types">${Kit.TYPES.map(([k, n]) => `<button data-type="${k}">${n}</button>`).join('')}</div>
    <div class="ch-swap">${Object.entries(Kit.ASSETS).map(([k, a]) => `<button data-asset="${k}">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar' : 'Nasdaq'}</button>`).join('')}</div></section>`,
  chartColors: up => {
    const ico = document.getElementById('chIco'); if (ico) ico.textContent = { gold: 'Au', usd: '$', ndq: 'N' }[Kit.CH.asset];
    return { text: '#6f8d99', grid: 'rgba(255,255,255,.05)', cross: 'rgba(255,255,255,.4)', label: '#eafcff', labelText: '#031015', up: '#39f2b6', down: '#ff6a8d', main: up ? '#2ee8d6' : '#ff6a8d', areaTop: up ? 'rgba(46,232,214,.4)' : 'rgba(255,106,141,.38)', areaBottom: 'rgba(46,232,214,0)', mono: '"DM Mono", monospace' };
  },
});
</script>
</body>
</html>
