<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<title>Briefly · Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Horizon: navy night meeting a warm horizon glow. Every card takes on the colours of its own photograph. */
:root {
  --bg: #0a0f24; --ink: #fbf7f2; --ink2: #d7d4e2; --mute: #9a98b2; --faint: #5f6080;
  --sun: 255,150,90; --rose: 255,90,130; --sky: 90,140,255;
  --ui: "Plus Jakarta Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --up: #4cf0b0; --down: #ff6d8a;
  color-scheme: dark;
}
body[data-view=world] { --sun: 255,170,90; } body[data-view=us] { --sun: 255,110,110; --rose: 120,140,255; } body[data-view=forex] { --sun: 255,200,90; --rose: 60,220,200; } body[data-view=tech] { --sun: 180,120,255; --rose: 80,200,255; }
* { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; } a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, #0a0f24 0%, #0d1330 45%, #1a1840 75%, #2a1a3c 100%); }
.sky::before { content: ""; position: absolute; left: -20%; right: -20%; bottom: -30vh; height: 70vh; border-radius: 50%; background: radial-gradient(50% 50% at 50% 50%, rgba(var(--sun),.45), rgba(var(--rose),.18) 45%, transparent 70%); filter: blur(30px); transition: background 1.2s; animation: breathe 9s ease-in-out infinite alternate; }
.sky::after { content: ""; position: absolute; left: 10%; right: 10%; top: -20vh; height: 50vh; border-radius: 50%; background: radial-gradient(50% 50% at 50% 50%, rgba(var(--sky),.18), transparent 70%); filter: blur(30px); }
@keyframes breathe { to { transform: translateY(-4vh) scale(1.05); } }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

.hero { position: relative; height: 300px; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: dawn 1.4s ease both; }
@keyframes dawn { from { opacity: 0; transform: scale(1.08); filter: brightness(.6); } }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,15,36,.55), rgba(10,15,36,.1) 30%, rgba(10,15,36,.5) 65%, #0a0f24 98%), linear-gradient(0deg, rgba(var(--sun),.25), transparent 40%); }
.hero .t { position: absolute; z-index: 1; left: 20px; right: 20px; bottom: 22px; }
.hi { font: 500 13px var(--ui); color: var(--ink2); }
.hero h1 { margin: 4px 0 0; font: 800 30px/1.05 var(--ui); letter-spacing: -.03em; }
.hero h1 span { background: linear-gradient(90deg, rgb(var(--sun)), rgb(var(--rose))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand { position: absolute; z-index: 2; top: calc(env(safe-area-inset-top,0px) + 14px); left: 20px; right: 20px; display: flex; align-items: center; }
.brand b { font: 800 17px var(--ui); letter-spacing: -.02em; }
.brand b i { font-style: normal; color: rgb(var(--sun)); }
.brand time { margin-left: auto; font: 500 11px var(--mono); padding: 5px 10px; border-radius: 999px; background: rgba(10,15,36,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

.tabs { position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; padding: calc(env(safe-area-inset-top,0px) + 10px) 16px 12px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(180deg, rgba(10,15,36,.95), rgba(10,15,36,.75) 80%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 9px 16px; border-radius: 999px; font: 700 13px var(--ui); color: var(--mute); background: rgba(255,255,255,.05); transition: .3s; }
.tab[aria-selected="true"] { color: #1a0d10; background: linear-gradient(100deg, rgb(var(--sun)), rgb(var(--rose))); box-shadow: 0 8px 24px -8px rgba(var(--rose),.8), 0 0 18px -6px rgba(var(--sun),.9); }

/* ambient cards */
.list { display: flex; flex-direction: column; gap: 12px; padding: 6px 16px 70px; }
.card { position: relative; display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 14px; padding: 10px; border-radius: 24px; overflow: hidden; isolation: isolate; animation: bloom .6s cubic-bezier(.2,.8,.2,1) both; }
.card .amb { position: absolute; inset: -30px; z-index: -2; background-size: cover; background-position: center; filter: blur(34px) saturate(1.6); opacity: .55; transform: scale(1.1); }
.card::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgba(10,15,36,.55), rgba(10,15,36,.86) 55%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.12); border-radius: 24px; }
.card .im { width: 100px; height: 108px; border-radius: 18px; overflow: hidden; background: #1a1d3a; box-shadow: 0 12px 24px -12px #000; }
.card .im img { width: 100%; height: 100%; object-fit: cover; }
@keyframes bloom { from { opacity: 0; transform: translateY(18px); } }
.meta { display: flex; align-items: center; gap: 7px; font: 600 11px var(--ui); color: var(--ink2); min-width: 0; }
.meta .o { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .ago { color: var(--mute); font-weight: 500; }
.h { margin: 5px 0 0; font: 700 15.5px/1.28 var(--ui); letter-spacing: -.012em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum { margin: 4px 0 0; font-size: 12.5px; line-height: 1.42; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live { font: 700 9.5px var(--ui); letter-spacing: .08em; padding: 2px 7px; border-radius: 999px; color: #fff; background: linear-gradient(90deg, #ff4d6d, #ff8a3d); }

/* Forex: the wallet */
.wallet { position: relative; padding: 4px 16px 6px; }
.wc { position: relative; display: flex; flex-direction: column; justify-content: flex-start; width: 100%; height: 178px; padding: 16px 18px; border-radius: 26px; text-align: left; overflow: hidden; animation: deal .6s cubic-bezier(.2,.9,.3,1.2) both;
  background: radial-gradient(120% 120% at 100% 0%, rgba(var(--c),.45), transparent 50%), radial-gradient(90% 90% at 0% 100%, rgba(var(--c2),.35), transparent 60%), linear-gradient(135deg, #1a2048, #10142e);
  box-shadow: inset 0 0 0 1px rgba(var(--c),.4), inset 0 1px 0 rgba(255,255,255,.2), 0 0 34px -10px rgba(var(--c),.7), 0 -10px 30px -10px rgba(0,0,0,.6); transition: transform .3s; }
.wc + .wc { margin-top: -112px; }
.wc:active { transform: translateY(-6px); }
@keyframes deal { from { opacity: 0; transform: translateY(40px) rotate(-2deg); } }
.wc .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; }
.wc .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font: 800 13px var(--ui); color: #120a14; background: rgb(var(--c)); box-shadow: 0 0 16px rgba(var(--c),.8); }
.wc .nm { font: 700 14px var(--ui); } .wc .sy { font: 500 10.5px var(--mono); color: var(--ink2); opacity: .8; }
.wc .pr { margin-left: auto; text-align: right; font: 800 21px/1 var(--ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.wc .cg { display: block; margin-top: 4px; font: 600 11px var(--mono); color: var(--up); } .wc .cg.dn { color: var(--down); }
.wc svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 96px; }
.wc .chip { position: absolute; right: 18px; bottom: 14px; z-index: 1; font: 600 10px var(--mono); padding: 4px 8px; border-radius: 999px; color: var(--ink); background: rgba(10,15,36,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.sun { display: flex; gap: 8px; padding: 8px 16px 14px; }
.sun div { flex: 1; padding: 10px 12px; border-radius: 18px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); font-size: 12px; color: var(--ink2); }
.sun b { display: block; font: 600 10px var(--mono); color: rgb(var(--sun)); margin-bottom: 2px; letter-spacing: .08em; }
/* Forex news: warm neon importance */
.fx { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: 24px; animation: bloom .6s both;
  background: radial-gradient(100% 140% at 0% 0%, rgba(var(--g),.22), transparent 55%), rgba(18,22,50,.8);
  box-shadow: inset 0 0 0 1.5px rgba(var(--g),.55), 0 0 22px -4px rgba(var(--g),.65), 0 0 70px -20px rgba(var(--g),.6); }
.fx.pulse { animation: bloom .6s both, ember 2.8s ease-in-out infinite; }
@keyframes ember { 50% { box-shadow: inset 0 0 0 1.5px rgba(var(--g),.85), 0 0 32px -2px rgba(var(--g),.85), 0 0 90px -16px rgba(var(--g),.8); } }
.trio { display: flex; flex-direction: column; gap: 4px; align-self: start; padding: 8px; border-radius: 16px; background: rgba(6,8,22,.65); }
.trio div { display: grid; grid-template-columns: 1fr auto; font: 600 8.5px var(--mono); color: var(--mute); }
.trio svg { grid-column: 1 / -1; width: 100%; height: 15px; }
.lvl { font: 800 10px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--g)); text-shadow: 0 0 12px rgba(var(--g),.9); }

/* chart: the wallet card lifts out and opens */
#chartPanel { position: fixed; inset: 0; z-index: 40; }
.ch-scrim { position: absolute; inset: 0; background: rgba(6,8,22,.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .35s; }
.ch { position: absolute; left: var(--ox); top: var(--oy); width: var(--ow); height: var(--oh); border-radius: 26px; overflow: hidden;
  background: radial-gradient(120% 60% at 100% 0%, rgba(var(--sun),.22), transparent 55%), radial-gradient(90% 60% at 0% 100%, rgba(var(--rose),.16), transparent 60%), linear-gradient(160deg, #1b2150, #0e1230);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.2), 0 40px 80px -20px #000, 0 0 60px -20px rgba(var(--sun),.6);
  transition: left .55s cubic-bezier(.3,1.15,.4,1), top .55s cubic-bezier(.3,1.15,.4,1), width .55s cubic-bezier(.3,1.15,.4,1), height .55s cubic-bezier(.3,1.15,.4,1), border-radius .5s; }
#chartPanel.open .ch-scrim { opacity: 1; }
#chartPanel.open .ch { left: 12px; width: calc(100% - 24px); top: max(16px, calc(50% - 250px)); height: 500px; border-radius: 32px; }
@media (min-width: 580px) { #chartPanel.open .ch { left: calc(50% - 270px); width: 540px; } }
.ch-in { width: min(calc(100vw - 24px), 540px); padding: 18px; opacity: 0; transition: opacity .2s; }
#chartPanel.open .ch-in { opacity: 1; transition: opacity .35s .3s; }
.ch-head { display: flex; align-items: center; gap: 10px; }
.ch-name { font: 800 17px var(--ui); letter-spacing: -.01em; } .ch-sym { font: 500 10.5px var(--mono); color: var(--mute); }
.ch-x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: var(--ink2); }
.ch-price { margin-top: 12px; font: 800 38px/1 var(--ui); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ch-chg { margin-top: 6px; font: 600 12px var(--mono); color: var(--up); } .ch-chg.dn { color: var(--down); } .ch-chg span { color: var(--mute); margin-left: 4px; } .ch-chg .ch-time { color: var(--ink2); margin: 0; }
.ch-assets { display: flex; gap: 6px; margin-top: 12px; }
.ch-assets button { padding: 7px 12px; border-radius: 999px; font: 700 12px var(--ui); color: var(--mute); background: rgba(255,255,255,.05); }
.ch-assets button[aria-pressed="true"] { color: var(--ink); background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
[data-k=chart] { height: 210px; margin: 10px -4px 8px; }
.ch-msg { display: grid; place-items: center; height: 100%; color: var(--mute); font-size: 13px; }
.ch-ranges { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.ch-ranges button, .ch-types button { height: 34px; border-radius: 999px; font: 700 12px var(--ui); color: var(--mute); transition: .25s; }
.ch-ranges button[aria-pressed="true"], .ch-types button[aria-pressed="true"] { color: #1a0d10; background: linear-gradient(100deg, rgb(var(--sun)), rgb(var(--rose))); box-shadow: 0 6px 18px -6px rgba(var(--rose),.9); }
.ch-types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.06); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<div id="chartPanel" hidden></div>
<script src="kit.js"></script>
<script>
const { esc, ago } = Kit;
const GLOW = { red: '255,72,100', gold: '255,184,64', cyan: '80,214,255' };
const MK = { gold: ['255,196,80', '255,120,60', 'Au'], usd: ['80,214,255', '90,110,255', '$'], ndq: ['255,90,190', '150,90,255', 'N'] };
const HEAD = { top: ['Here’s what <span>matters</span>'], world: ['The <span>world</span> tonight'], us: ['Across <span>America</span>'], forex: ['Your <span>markets</span>'], tech: ['The <span>frontier</span>'] };
function greet() { const h = new Date().getHours(); return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function card(s, i) {
  const t = Kit.thumb(s, Kit.catOf(s), 260);
  return `<a class="card" href="${esc(s.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 8) * 50}ms"><span class="amb" style="background-image:url('${esc(t.src)}')"></span><div class="im">${Kit.img(t, '')}</div>
    <div style="min-width:0;padding:2px 4px 0 0"><div class="meta">${s.breaking ? '<span class="live">LIVE</span>' : ''}<span class="o">${esc(s.outlet)}</span><span class="ago">· ${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.summary ? `<p class="sum">${esc(s.summary)}</p>` : ''}</div></a>`;
}
function fx(s, i) {
  const lv = Kit.level(s), fc = Kit.forecasts(s.fx, { w: 74, h: 15 });
  return `<a class="fx ${lv.k === 'red' ? 'pulse' : ''}" href="${esc(s.link)}" target="_blank" rel="noopener" style="--g:${GLOW[lv.k]};animation-delay:${Math.min(i, 8) * 50}ms">
    <div class="trio">${fc.map(f => `<div><span>${f.label}</span><span style="color:${f.color}">${f.dir === 'up' ? '▲' : f.dir === 'down' ? '▼' : '–'} ${f.conf || ''}</span>${f.svg}</div>`).join('')}</div>
    <div style="min-width:0"><div class="meta"><span class="lvl">${lv.tag}</span><span class="o">${esc(s.outlet)}</span><span class="ago">· ${ago(s.published)}</span></div>
    <h3 class="h">${esc(s.title)}</h3>${s.fx?.why ? `<p class="sum">${esc(s.fx.why)}</p>` : ''}</div></a>`;
}
function wallet() {
  const cards = ['ndq', 'usd', 'gold'].map((k, i) => {
    const m = Kit.series(k, '1W'), up = (m.chg ?? 0) >= 0, [c, c2, ic] = MK[k];
    return `<button class="wc" data-chart="${k}" style="--c:${c};--c2:${c2};animation-delay:${i * 90}ms">
      <div class="row"><span class="ic">${ic}</span><div><div class="nm">${k === 'usd' ? 'US Dollar Index' : Kit.ASSETS[k].name}</div><div class="sy">${Kit.ASSETS[k].sym}</div></div>
      <div class="pr">${Kit.price(k, m.last)}<span class="cg ${up ? '' : 'dn'}">${m.chg == null ? '—' : `${up ? '+' : ''}${m.chg.toFixed(2)}%`} · 1W</span></div></div>
      ${Kit.spark(m.pts, { w: 300, h: 96, color: `rgb(${c})`, n: 80, stroke: 2.2, glow: 3, fillOpacity: .5, padX: 0 })}<span class="chip">Open chart ↗</span></button>`;
  }).join('');
  const ev = (Kit.data?.calendar?.events || []).map(e => ({ ...e, t: Date.parse(e.time) })).filter(e => e.impact === 'high' && e.t > Date.now()).sort((a, b) => a.t - b.t)[0];
  const ny = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date());
  const ln = +new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/London', hour: 'numeric', hourCycle: 'h23' }).format(new Date());
  return `<div class="wallet">${cards}</div><div class="sun"><div><b>SESSIONS</b>${[ln >= 8 && ln < 17 ? 'London open' : '', ny >= 8 && ny < 17 ? 'New York open' : ''].filter(Boolean).join(' · ') || 'Asia trading'}</div><div><b>NEXT</b>${ev ? `${esc(ev.title)} · ${new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(ev.t)}` : 'Quiet week ahead'}</div></div>`;
}
Kit.start({
  shell: () => `<section class="hero" id="hero"></section><nav class="tabs">${Kit.TABS.map(t => `<button class="tab" data-tab="${t.id}">${t.name}</button>`).join('')}</nav><main id="feedArea"></main>`,
  renderTab(tab, list) {
    document.getElementById('hero').innerHTML = `<img src="${Kit.photo(tab, 1300, 0)}" alt=""><div class="brand"><b>Brief<i>ly</i></b><time>${new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' }).format(new Date())}</time></div>
      <div class="t"><div class="hi">${greet()} · ${list.length} stories</div><h1>${HEAD[tab][0]}</h1></div>`;
    const area = document.getElementById('feedArea');
    if (tab === 'forex') { area.innerHTML = wallet() + `<div class="list">${list.map((s, i) => s.fx ? fx(s, i) : card(s, i)).join('')}</div>`; return; }
    area.innerHTML = `<div class="list">${list.map(card).join('')}</div>`;
  },
  chartShell: () => `<div class="ch-scrim"></div><section class="ch" role="dialog" aria-label="Chart"><div class="ch-in">
    <div class="ch-head"><div><div class="ch-name" data-k="name"></div><div class="ch-sym" data-k="sym"></div></div><button class="ch-x" data-close aria-label="Close">✕</button></div>
    <div class="ch-price" data-k="price"></div><div class="ch-chg" data-k="chg"></div>
    <div class="ch-assets">${Object.entries(Kit.ASSETS).map(([k]) => `<button data-asset="${k}">${k === 'gold' ? 'Gold' : k === 'usd' ? 'Dollar' : 'Nasdaq'}</button>`).join('')}</div>
    <div data-k="chart"></div>
    <div class="ch-ranges">${Kit.RANGES.map(r => `<button data-range="${r}">${r}</button>`).join('')}</div>
    <div class="ch-types">${Kit.TYPES.map(([k, n]) => `<button data-type="${k}">${n}</button>`).join('')}</div></div></section>`,
  chartColors: up => ({ text: '#8a88a6', grid: 'rgba(255,255,255,.05)', cross: 'rgba(255,255,255,.4)', label: '#fbf7f2', labelText: '#1a0d10', up: '#4cf0b0', down: '#ff6d8a', main: up ? '#ffb45a' : '#ff6d8a', areaTop: up ? 'rgba(255,170,80,.4)' : 'rgba(255,109,138,.38)', areaBottom: 'rgba(255,90,130,0)', mono: '"JetBrains Mono", monospace' }),
});
</script>
</body>
</html>
