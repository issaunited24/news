<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">
<title>Briefly</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://wsrv.nl">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Briefly · Cinema
   Every tab is a film still: its photograph fills the screen behind the news and dims as you scroll.
   The tab's name is cut out of the photo in giant letters. Importance glows appear on Forex only. */
:root {
  --bg: #05070f; --ink: #f4f1ea; --ink2: #cfd3e2; --mute: #8e95ad; --faint: #5a627c;
  --tint: 255,196,120;
  --serif: Fraunces, Georgia, serif; --ui: "Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --up: #3ef0b4; --down: #ff6487; --flat: #8a90a8;
  --red: 255,72,108; --gold: 255,190,70; --cyan: 77,225,255;
  color-scheme: dark;
}
body[data-view=top] { --tint: 255,196,120; } body[data-view=justin] { --tint: 255,96,120; } body[data-view=world] { --tint: 255,150,90; }
body[data-view=us] { --tint: 120,160,255; } body[data-view=forex] { --tint: 60,230,200; } body[data-view=tech] { --tint: 160,120,255; }
body[data-view=sports] { --tint: 255,130,60; } body[data-view=ent] { --tint: 255,90,190; } body[data-view=sci] { --tint: 90,220,255; }
body[data-view=saved], body[data-view=search] { --tint: 200,190,255; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid rgb(var(--tint)); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

/* The backdrop: the tab's photograph, filling the screen behind everything */
.bd { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0a0f22; }
.bd img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .7s ease; -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 140px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 140px), transparent); }
.bd img.on { opacity: 1; }
.bd::after { content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(5,7,15,.42) 0%, rgba(5,7,15,.12) 22%, rgba(5,7,15,.3) 40%, rgba(5,7,15,.62) 60%, rgba(5,7,15,.9) 86%),
    linear-gradient(0deg, rgba(10,16,40,.6), rgba(10,16,40,0) 60%); }
/* darkens the photo as you scroll into the news (only its opacity changes, which is cheap) */
.dim { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: rgba(5,7,15,.8); opacity: 0; will-change: opacity; }
.wrap { position: relative; z-index: 2; max-width: 640px; margin: 0 auto; }

/* Top bar */
.bar { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0 20px; }
.logo { font: 600 21px var(--serif); letter-spacing: -.02em; }
.logo i { font-style: italic; color: rgb(var(--tint)); transition: color .8s; }
.live { display: flex; align-items: center; gap: 6px; font: 500 10px var(--mono); color: var(--ink2); padding: 4px 9px; border-radius: 999px; background: rgba(5,7,15,.45); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.live.stale { color: #ffc463; }
.ib.rf { width: 36px; height: 36px; margin-left: -4px; }
.ib.rf svg { width: 15px; height: 15px; }
.ib.rf.spin svg { animation: rfspin .8s linear infinite; }
@keyframes rfspin { to { transform: rotate(360deg); } }
.ping { position: relative; width: 6px; height: 6px; border-radius: 50%; background: #ff3d6a; }
.ping::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #ff3d6a; animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
.live.stale .ping, .live.stale .ping::after { background: #ffc463; }
.icons { margin-left: auto; display: flex; }
.ib { width: 42px; height: 42px; display: grid; place-items: center; color: var(--ink2); border-radius: 12px; position: relative; }
.ib svg { width: 19px; height: 19px; filter: drop-shadow(0 1px 6px rgba(0,0,0,.6)); }
.ib.on { color: #fff; }
.ib.on::after { content: ""; position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 50%; background: rgb(var(--tint)); box-shadow: 0 0 6px rgb(var(--tint)); }
.ib .badge { position: absolute; top: 6px; right: 5px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: rgb(var(--tint)); color: #05070f; font: 700 9.5px/15px var(--ui); text-align: center; }
.search { display: flex; align-items: center; gap: 8px; margin: 10px 16px 0; height: 44px; padding: 0 6px 0 12px; border-radius: 14px; background: rgba(5,7,15,.88); box-shadow: inset 0 0 0 1px rgba(var(--tint),.45); color: var(--mute); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--ink); font: 500 15px var(--ui); }
.search input::placeholder { color: var(--faint); }
.search button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--mute); }

/* The title: the tab's name cut out of its photograph */
.mast { position: relative; isolation: isolate; padding: 19vh 18px 22px; overflow: hidden; }
.mast::before { content: ""; position: absolute; left: 0; right: 0; top: 8vh; bottom: 0; z-index: -1; background: radial-gradient(90% 60% at 30% 60%, rgba(5,7,15,.55), rgba(5,7,15,0) 70%); }
.mast > * { position: relative; }
.kick { font: 600 10.5px var(--mono); letter-spacing: .22em; color: rgb(var(--tint)); text-transform: uppercase; transition: color .8s; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
.word { display: block; margin: 6px 0 0 -4px; font: 900 100px/.84 var(--ui); letter-spacing: -.055em; text-transform: uppercase; white-space: nowrap;
  background-size: cover; background-position: center 40%; -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,.28); filter: brightness(1.5) saturate(1.2) drop-shadow(0 4px 16px rgba(0,0,0,.55)); animation: pour 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pour { from { opacity: 0; letter-spacing: .02em; } }
.mast p { margin: 12px 0 0; max-width: 34ch; color: var(--ink2); font-size: 14px; text-shadow: 0 1px 12px rgba(0,0,0,.7); }


/* Morning brief (top of Forex) */
.brief { position: relative; margin: 0 16px 14px; padding: 14px 14px 12px; border-radius: 20px; background: linear-gradient(160deg, rgba(255,190,90,.12), rgba(10,16,34,.9) 45%); box-shadow: inset 0 0 0 1px rgba(255,200,120,.22), 0 0 28px -12px rgba(255,190,90,.5); touch-action: pan-y; transition: transform .25s, opacity .25s; }
.brief .bk { font: 600 10.5px var(--mono); letter-spacing: .18em; color: #ffcc66; text-transform: uppercase; }
.brief .bs { margin: 3px 0 10px; font-size: 12.5px; color: var(--mute); }
.brief .bx { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--mute); }
.br-mv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.br-mv div { padding: 8px 9px; border-radius: 13px; background: rgba(255,255,255,.04); }
.br-mv b { display: block; font: 600 11px var(--mono); color: rgb(var(--pc)); letter-spacing: .06em; }
.br-mv span { font: 600 15px var(--mono); }
.br-h { margin: 12px 0 5px; font: 600 10px var(--mono); letter-spacing: .16em; color: var(--mute); text-transform: uppercase; }
.br-st { display: block; width: 100%; text-align: left; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 13.5px; line-height: 1.35; }
.br-st small { display: block; margin-top: 2px; font: 500 10.5px var(--mono); color: var(--mute); }
.br-st .ar { font-weight: 700; } .br-st .ar.u { color: var(--up); } .br-st .ar.d { color: var(--down); }
.br-ev { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 13px; }
.br-ev time { flex: none; min-width: 62px; white-space: nowrap; font: 600 11.5px var(--mono); color: #ffcc66; }
.br-ev .hi { color: #ff6487; } .br-ev em { font-style: normal; font: 500 11px var(--mono); color: var(--mute); margin-left: auto; text-align: right; flex: none; }
.brief-mini { display: flex; align-items: center; gap: 10px; width: calc(100% - 32px); margin: 0 16px 12px; padding: 10px 14px; border-radius: 16px; background: rgba(255,190,90,.08); box-shadow: inset 0 0 0 1px rgba(255,200,120,.18); font: 600 12px var(--mono); color: var(--ink2); text-align: left; }
.brief-mini b { color: #ffcc66; letter-spacing: .1em; }


/* Bias meter (top of Forex): every recent call combined into one reading per market */
.bias { margin: 0 16px 14px; padding: 12px 12px 10px; border-radius: 20px; background: rgba(10,16,34,.86); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.bias-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 9px; font: 600 10.5px var(--mono); letter-spacing: .16em; color: var(--mute); text-transform: uppercase; }
.bias-h span:last-child { letter-spacing: .04em; text-transform: none; font-weight: 500; }
.bias-g { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.bi { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 8px 8px 7px; border-radius: 14px; text-align: left; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(var(--bc),.25); }
.bi b { font: 600 10.5px var(--mono); letter-spacing: .06em; color: rgb(var(--pc)); }
.bi .bw { font: 800 13px var(--ui); color: rgb(var(--bc)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bi .bm { height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
.bi .bm i { position: absolute; top: 0; bottom: 0; left: 50%; border-radius: 4px; background: rgb(var(--bc)); box-shadow: 0 0 8px rgba(var(--bc),.8); }
.bi small { font: 500 9.5px var(--mono); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


/* Big money (top of Forex): how hedge funds are positioned, from the weekly CFTC report */
.bm-g { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.bmc { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 8px 8px 7px; border-radius: 14px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.bmc b { font: 600 10.5px var(--mono); letter-spacing: .06em; color: rgb(var(--pc)); }
.bmc .bv { font: 800 12.5px var(--ui); white-space: nowrap; letter-spacing: -.01em; }
.bmc .bt { position: relative; height: 4px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,100,135,.55), rgba(255,255,255,.08) 20%, rgba(255,255,255,.08) 80%, rgba(62,240,180,.55)); }
.bmc .bt i { position: absolute; top: -3px; width: 3px; height: 10px; margin-left: -1.5px; border-radius: 2px; background: #fff; box-shadow: 0 0 6px #fff; }
.bmc small { font: 500 9.5px/1.3 var(--mono); color: var(--mute); white-space: normal; }
.bmc small.hot { color: #ffc463; }

/* Tabs */
.tabs { position: sticky; top: 0; z-index: 10; display: flex; gap: 22px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 12px; overflow-x: auto; scrollbar-width: none;
  background: linear-gradient(180deg, rgba(5,7,15,.97), rgba(5,7,15,.9) 75%, rgba(5,7,15,0)); }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; flex: none; padding: 6px 0; font-weight: 600; font-size: 14.5px; color: var(--mute); white-space: nowrap; transition: color .3s; }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px; background: rgb(var(--tint)); box-shadow: 0 0 12px rgba(var(--tint),.9); transform: scaleX(0); transition: transform .35s cubic-bezier(.2,.8,.2,1), background .8s; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { transform: none; }
.tab .dot { display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: #ff3d6a; box-shadow: 0 0 8px #ff3d6a; vertical-align: 2px; }

/* Section row */
main { touch-action: pan-y; will-change: transform; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 20px 4px; }
.seg { display: flex; gap: 2px; align-items: baseline; font: 600 10.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
.seg button { padding: 4px 2px; color: var(--faint); font: inherit; letter-spacing: inherit; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .sl { color: var(--faint); }
.meta-r { font: 500 10.5px var(--mono); color: rgb(var(--tint)); text-align: right; letter-spacing: .06em; }
.meta-r.muted { color: var(--mute); }

/* Story rows */
.feed { padding: 0 20px 10px; }
.mw { position: relative; animation: up .6s cubic-bezier(.2,.8,.2,1) both; }
.feed.settled .mw, .feed.settled .poster { animation: none; }
.feed > .mw { content-visibility: auto; contain-intrinsic-size: auto 150px; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }
.st { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 14px 0; }
.st + .st::before, .divider + .st::before { content: ""; position: absolute; top: 0; left: 126px; right: 0; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.1), transparent); }
.ph { display: block; width: 112px; height: 84px; border-radius: 12px; overflow: hidden; background: #111833; box-shadow: 0 12px 24px -12px rgba(0,0,0,.9); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tx { min-width: 0; }
.meta { display: flex; flex-wrap: wrap; row-gap: 5px; align-items: center; gap: 8px; font: 500 10.5px var(--mono); color: var(--mute); letter-spacing: .04em; min-width: 0; }
.meta .o { color: rgb(var(--tint)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; transition: color .8s; }
.meta .ag { white-space: nowrap; }
.title { display: block; width: 100%; margin-top: 4px; text-align: left; font: 600 16px/1.26 var(--serif); letter-spacing: -.012em; color: var(--ink); text-wrap: pretty; }
.title .tl { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
/* Cards stay about the same height: long headlines get a one-line summary, short ones get two */
.st { min-height: 156px; align-content: start; }
.st.long .sum, .fx.long .why { -webkit-line-clamp: 1; }
.fx .why { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fx { min-height: 176px; align-content: start; }
.sum { margin: 4px 0 0; font-size: 12.5px; line-height: 1.42; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.live-b { flex: none; color: #fff; background: #e8324f; padding: 1px 6px; border-radius: 4px; font-weight: 600; box-shadow: 0 0 12px rgba(232,50,79,.7); }
.pill { flex: none; font: 600 9px var(--mono); letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; color: #05070f; background: #d8d2ff; }
.pill.jin { color: #fff; background: #ff4d6d; box-shadow: 0 0 10px rgba(255,77,109,.6); }
.pill.flag { color: rgb(var(--tint)); background: rgba(var(--tint),.12); box-shadow: inset 0 0 0 1px rgba(var(--tint),.35); }
.foot { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.cat { font: 500 9.5px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; margin-right: auto; }
.chip { font: 500 10px var(--mono); color: var(--ink2); padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.act { width: 34px; height: 32px; display: grid; place-items: center; color: var(--faint); border-radius: 8px; }
.act svg { width: 15px; height: 15px; }
.act.saved { color: rgb(var(--tint)); filter: drop-shadow(0 0 5px rgba(var(--tint),.8)); }
.others { margin: 6px 0 2px; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(5,7,15,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.others a { font-size: 13px; color: var(--mute); line-height: 1.35; }
.others a b { font: 600 10.5px var(--mono); color: rgb(var(--tint)); margin-right: 6px; text-transform: uppercase; }
.mw.read .ph, .mw.read .title, .mw.read .sum { opacity: .5; }
.divider { display: flex; align-items: center; gap: 10px; font: 500 10px var(--mono); letter-spacing: .1em; color: rgb(var(--tint)); margin: 4px 0; }
.divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(var(--tint),.4), transparent); }

/* Top: a small "now showing" row */
.posters { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 20px; padding: 10px 20px 8px; scrollbar-width: none; }
.posters::-webkit-scrollbar { display: none; }
.poster { position: relative; flex: 0 0 40%; max-width: 190px; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; scroll-snap-align: start; background: #111833; text-align: left;
  box-shadow: 0 20px 30px -22px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.07); animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,7,15,0) 30%, rgba(5,7,15,.95)); }
.poster .in { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1; }
.poster .meta { font-size: 9px; gap: 6px; }
.poster h3 { margin: 4px 0 0; font: 600 13.5px/1.18 var(--serif); letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.poster .num { position: absolute; top: 8px; left: 10px; z-index: 1; font: 600 10px var(--mono); color: rgba(255,255,255,.85); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.poster.read::after { background: linear-gradient(180deg, rgba(5,7,15,.35), rgba(5,7,15,.95)); }
.sec { padding: 12px 20px 0; font: 600 10.5px var(--mono); letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }

/* Forex: the market stage (one big chart, switch between gold, dollar and Nasdaq) */
.prism { margin: 6px 16px 0; padding: 14px; border-radius: 28px;
  background: linear-gradient(135deg, rgba(255,255,255,.11), rgba(255,255,255,.03)), rgba(12,18,40,.88);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), inset 0 1px 0 rgba(255,255,255,.2), 0 0 50px -16px rgba(var(--c),.55), 0 30px 50px -30px #000; transition: box-shadow .5s; }
.pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pk { padding: 9px 8px; border-radius: 18px; text-align: left; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: .3s; min-width: 0; }
.pk .n { font: 700 11px var(--ui); color: var(--mute); }
.pk .v { font: 800 15px var(--ui); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk .c small { font-size: .8em; opacity: .7; }
.pk .c { font: 600 10px var(--mono); color: var(--up); } .pk .c.dn { color: var(--down); }
.pk[aria-pressed="true"] { background: rgba(var(--pc),.16); box-shadow: inset 0 0 0 1px rgba(var(--pc),.6), 0 0 22px -6px rgba(var(--pc),.8); }
.pk[aria-pressed="true"] .n { color: rgb(var(--pc)); }
.stage { position: relative; display: block; width: 100%; margin-top: 12px; text-align: left; }
.stage .big { font: 800 38px/1 var(--ui); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.stage .sub { margin-top: 5px; font: 600 11.5px var(--mono); color: var(--mute); }
.lv { display: inline-flex; align-items: center; gap: 5px; color: var(--ink2); }
.stage .big.tick { animation: tick .6s ease; }
@keyframes tick { 30% { color: rgb(var(--c)); text-shadow: 0 0 18px rgba(var(--c),.6); } }
.stage svg { display: block; width: 100%; height: 120px; margin-top: 8px; }
.stage .go { position: absolute; right: 0; top: 2px; font: 700 11.5px var(--ui); padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
.stage:active { transform: scale(.99); }

/* Forex: sessions, next event, calendar, scorecard */
.fxmods { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.glass { border-radius: 20px; background: rgba(10,16,34,.86); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }

.ss-line { font-size: 12.5px; color: var(--mute); line-height: 1.35; }

.next { display: flex; align-items: center; gap: 14px; padding: 12px 14px; width: 100%; text-align: left; }

.next-t { font: 600 17px/1.2 var(--serif); }
.next-s { font-size: 11.5px; color: var(--mute); }

.pb { display: flex; flex-direction: column; gap: 3px; margin: 2px 6px 0; font: 500 10.5px var(--mono); color: var(--mute); }

.pb i { font-style: normal; } .pb i.u { color: var(--up); } .pb i.d { color: var(--down); } .pb i.m { color: #ffc463; }
.cal { display: flex; flex-direction: column; gap: 8px; }
.cal-day { margin: 6px 4px 0; font: 600 10px var(--mono); letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }
.sb { border-radius: 16px; overflow: hidden; background: linear-gradient(160deg, rgba(var(--c),.13), rgba(14,20,44,.96) 45%); box-shadow: inset 0 0 0 1px rgba(var(--c),.28), 0 0 22px -12px rgba(var(--c),.8); }
.sb-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; }

.sb-when { margin-left: auto; font: 600 10.5px var(--mono); color: var(--ink2); }
.sb-n { padding: 3px 12px 0; font: 600 15px/1.22 var(--serif); }
.sb-g { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 9px; border-top: 1px solid rgba(255,255,255,.06); }

.sb-g strong.beat { color: var(--up); } .sb-g strong.miss { color: var(--down); }

.sb-res { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: rgba(0,0,0,.25); font: 500 10.5px/1.6 var(--mono); color: var(--ink2); }
.sb-res i { font-style: normal; } .sb-res i.u { color: var(--up); } .sb-res i.d { color: var(--down); } .sb-res i.m { color: #ffc463; }
.sb-tag { padding: 2px 8px; border-radius: 999px; font-weight: 700; }
.sb-tag.beat { color: #04140f; background: var(--up); } .sb-tag.miss { color: #fff; background: #e8324f; } .sb-tag.inline { color: var(--ink); background: rgba(255,255,255,.12); }
.sb.wait { box-shadow: inset 0 0 0 1px rgba(var(--c),.5), 0 0 26px -8px rgba(var(--c),.9); }

.ev { display: grid; grid-template-columns: 58px 40px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.05); font-size: 13px; }

.ev .when { font: 500 10.5px/1.25 var(--mono); color: var(--mute); }

.ev .imp.medium { background: #ffc463; box-shadow: 0 0 6px #ffc463; }
.cal-tog { width: 100%; padding: 11px; border-top: 1px solid rgba(255,255,255,.05); color: var(--mute); font-size: 12.5px; font-weight: 700; }
.sc { padding: 12px 14px; }
.sc-h { display: flex; justify-content: space-between; gap: 8px; font: 500 9.5px var(--mono); letter-spacing: .12em; color: var(--mute); }

.sc-g { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.sc-c { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 0; border-radius: 12px; background: rgba(255,255,255,.04); }
.sc-k { font: 600 9.5px var(--mono); letter-spacing: .1em; color: var(--mute); }

.sc-n { font: 500 9.5px var(--mono); color: var(--faint); }

/* Forex news: the importance light (red / gold / cyan) lives only here */
.fx { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; margin: 0 0 12px; padding: 12px 14px 8px 16px; border-radius: 18px;
  background: linear-gradient(90deg, rgba(var(--g),.12), rgba(12,18,40,.7) 40%), rgba(10,14,32,.9);
  box-shadow: inset 0 0 0 1px rgba(var(--g),.22), 0 0 30px -12px rgba(var(--g),.7); }
.feed .fx:first-child { margin-top: 10px; }
.fx::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: rgb(var(--g)); box-shadow: 0 0 10px rgb(var(--g)), 0 0 26px rgba(var(--g),.8); }
.fx.pulse::before { animation: flick 2.4s ease-in-out infinite; }
@keyframes flick { 50% { opacity: .55; box-shadow: 0 0 4px rgb(var(--g)); } }
.mini { display: flex; flex-direction: column; gap: 6px; align-self: start; padding: 7px; border-radius: 12px; background: rgba(3,5,14,.65); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }

.mini svg { display: block; width: 100%; height: 15px; }
.lvl { flex: none; font: 600 9.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgb(var(--g)); text-shadow: 0 0 10px rgba(var(--g),.8); }
.fx .title { font-size: 15.5px; }
.why { margin-top: 4px; font-size: 12px; line-height: 1.38; color: var(--mute); }
.drv { display: inline-block; font: 600 9.5px var(--mono); letter-spacing: .1em; color: var(--ink2); padding: 1px 6px; margin-right: 6px; border-radius: 4px; background: rgba(255,255,255,.07); }
.fx.read .title, .fx.read .why, .fx.read .mini { opacity: .5; }

/* Empty, more, footer */
.empty { text-align: center; padding: 56px 16px; color: var(--mute); }
.empty h2 { font: 600 22px var(--serif); color: var(--ink); margin: 0 0 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 14px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.btn.primary { color: #05070f; background: rgb(var(--tint)); box-shadow: 0 0 18px rgba(var(--tint),.45); }
.more { display: flex; margin: 14px auto 0; }
footer { text-align: center; color: var(--faint); font: 500 10.5px var(--mono); letter-spacing: .04em; padding: 26px 20px 40px; }

/* Sheets: menus, settings and the floating story card */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(3,5,12,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .25s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 86vh; overflow-y: auto; border-radius: 26px 26px 0 0;
  background: linear-gradient(180deg, rgba(18,24,52,.98), rgba(7,10,24,.99)); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 -20px 60px rgba(0,0,0,.6);
  transform: translateY(100%); visibility: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.sheet .in { max-width: 640px; margin: 0 auto; padding: 8px max(18px, env(safe-area-inset-right, 0px)) 26px max(18px, env(safe-area-inset-left, 0px)); }
.grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 6px auto 14px; }
.sheet h2 { font: 600 21px/1.22 var(--serif); margin: 0 0 4px; }
.sheet h4 { font: 600 10.5px var(--mono); letter-spacing: .18em; color: var(--mute); margin: 22px 0 8px; text-transform: uppercase; }
.sheet .item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 0 4px; border-bottom: 1px solid rgba(255,255,255,.06); text-align: left; font-size: 15px; font-weight: 600; }
.sheet .item svg { width: 19px; height: 19px; color: var(--mute); flex: none; }
.muted { color: var(--mute); font-size: 13px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); font-size: 13px; font-weight: 600; }
.pills button::after { content: " ✕"; color: var(--faint); }
.srcrow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
.srcrow span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ok { color: var(--up); font: 500 11.5px var(--mono); flex: none; }
.bad { color: var(--down); font: 500 11.5px var(--mono); flex: none; }
textarea { width: 100%; min-height: 110px; background: rgba(0,0,0,.4); color: var(--ink); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 10px; font: 12px/1.4 var(--mono); resize: vertical; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sheet.float { left: 50%; right: auto; width: min(calc(100vw - 32px), 380px); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-height: min(78vh, 700px); border-radius: 26px; transform: translate(-50%, 115%); overscroll-behavior: contain;
  background: radial-gradient(120% 60% at 100% 0%, rgba(var(--pv),.14), transparent 55%), linear-gradient(180deg, rgba(18,24,52,.98), rgba(8,11,26,.99));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 1px 0 rgba(255,255,255,.14), 0 30px 70px -20px #000, 0 0 50px -16px rgba(var(--pv),.55); }
.sheet.float.open { transform: translate(-50%, 0); }
.sheet.float .in { padding: 14px 16px 16px; }
#sheet { touch-action: pan-y; }
#sheetBody { will-change: transform; }
.pv-top { display: flex; align-items: center; gap: 10px; margin: -2px -4px 10px 0; }
.pv-pos { font: 500 10.5px var(--mono); color: var(--faint); }
.pv-hint { font: 500 10.5px var(--mono); color: var(--faint); margin-right: auto; }
.pv-x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); background: rgba(255,255,255,.07); }
.pv-x svg { width: 15px; height: 15px; }
.pv .meta .o { color: rgb(var(--pv)); }
.pv-title { font: 600 22px/1.2 var(--serif); letter-spacing: -.015em; margin: 8px 0 0; text-wrap: pretty; }
.pv-sum { font-size: 14.5px; line-height: 1.55; color: var(--ink2); margin: 10px 0 0; }
.pv-sum small { color: var(--faint); font-size: 12.5px; }
.pv-k { font: 600 10px var(--mono); letter-spacing: .18em; color: var(--mute); margin: 18px 0 8px; text-transform: uppercase; }
.pv-take { font-size: 13.5px; line-height: 1.5; color: var(--mute); margin: 0 0 8px; padding-left: 10px; border-left: 1px solid rgba(var(--pv),.5); }
.pv-take b { display: block; font: 600 10.5px var(--mono); letter-spacing: .06em; color: var(--ink2); text-transform: uppercase; margin-bottom: 1px; }
.pv-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.pv-chips a, .pv-chips span { font: 600 12px var(--ui); padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.pv-chips span { color: var(--mute); }
.pv .mini { flex-direction: row; gap: 10px; margin-top: 14px; padding: 8px 10px; }
.pv .mini > div { flex: 1; min-width: 0; }
.pv-why { font-size: 13px; color: var(--mute); margin: 8px 0 0; }
/* AI analysis panel (story view) */
.ai { margin-top: 12px; padding: 12px; border-radius: 16px; background: rgba(3,5,14,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.ai-load { margin: 0; font-size: 12.5px; color: var(--mute); }
.ai-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 500 9.5px var(--mono); letter-spacing: .12em; color: var(--mute); }
.ai-st { padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; background: rgba(255,255,255,.08); color: var(--ink2); white-space: nowrap; }
.ai-st.confirmed, .ai-st.official { background: rgba(62,240,180,.14); color: #6ff5c7; }
.ai-st.unverified, .ai-st.speculation, .ai-st.opinion, .ai-st.conflicting { background: rgba(255,196,99,.14); color: #ffc463; }
.ai-what { margin: 9px 0 4px; font-size: 14px; line-height: 1.4; color: var(--ink); }
.ai-meta { margin: 4px 0 0; font-size: 12px; line-height: 1.45; color: var(--mute); }

.ai-m { margin-top: 9px; border-top: 1px solid rgba(255,255,255,.06); padding-top: 8px; }

.ai-m summary::-webkit-details-marker { display: none; }
.ai-m summary b { letter-spacing: .1em; color: var(--ink); min-width: 64px; }
.ai-b { color: var(--mute); }
.ai-b.bullish { color: var(--up); } .ai-b.bearish { color: var(--down); }
.ai-fin { margin-left: auto; color: var(--mute); white-space: nowrap; } .ai-fin.u { color: var(--up); } .ai-fin.d { color: var(--down); }
.ai-f { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; margin: 6px 0 0; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.035); font-size: 12.5px; }
.ai-f b { font-weight: 600; } .ai-f.u b { color: var(--up); } .ai-f.d b { color: var(--down); }
.ai-f span { grid-column: 1; color: var(--mute); font-size: 12px; line-height: 1.35; }
.ai-f i { grid-column: 2; grid-row: 1; font: 500 10px var(--mono); font-style: normal; color: var(--faint); }
.ai-m p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--ink2); }
.ai-note { margin: 10px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--faint); }
.ai-note span { display: block; margin-top: 3px; font: 500 10px var(--mono); }
.hz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.hz button { min-height: 36px; border-radius: 10px; font: 600 12px var(--mono); letter-spacing: .04em; color: var(--mute); }
.hz button[aria-pressed="true"] { background: rgba(255,255,255,.12); color: var(--ink); }
.hz-n { margin: -4px 4px 0; font-size: 11.5px; color: var(--faint); }
.lv-box { margin-top: 10px; padding: 9px 11px; border-radius: 14px; background: rgba(3,5,14,.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.lv-r { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font: 500 11.5px var(--mono); color: var(--ink2); padding: 3px 0; }
.lv-h { font-size: 9.5px; letter-spacing: .12em; color: var(--mute); min-width: 86px; }
.lv-r i { font-style: normal; } .lv-r i.u { color: var(--up); } .lv-r i.d { color: var(--down); }
.lv-n { margin: 5px 0 0; font-size: 11px; color: var(--faint); }
.pill.aip { background: rgba(160,140,255,.16); color: #c4b8ff; border: 0; font: inherit; cursor: pointer; position: relative; }
.pill.aip::after { content: ''; position: absolute; inset: -10px -6px; } /* bigger tap area */
.pv-actions { display: grid; grid-template-columns: 50px 50px minmax(0, 1fr); gap: 10px; margin-top: 20px; }
.pv-actions .sq { height: 50px; border-radius: 16px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); color: var(--ink2); display: grid; place-items: center; }
.pv-actions .sq svg { width: 18px; height: 18px; }
.pv-actions .sq.saved { color: rgb(var(--pv)); box-shadow: inset 0 0 0 1px rgba(var(--pv),.55), 0 0 14px rgba(var(--pv),.3); }
.pv-actions .go { height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 15px; color: #05070f; background: rgb(var(--pv)); box-shadow: 0 0 22px -4px rgba(var(--pv),.7); padding: 0 12px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 60; padding: 11px 16px; border-radius: 14px; background: rgba(18,24,52,.97); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 10px 30px rgba(0,0,0,.5); font-weight: 700; font-size: 14px; opacity: 0; transition: .22s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* The chart: the market stage grows into it */
#chartPanel { position: fixed; inset: 0; z-index: 50; }
.ch-scrim { position: absolute; inset: 0; background: rgba(3,5,12,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .35s; }
.ch { position: absolute; overflow: hidden; border-radius: 22px; left: var(--ox, 12px); top: var(--oy, 50%); width: var(--ow, calc(100% - 24px)); height: var(--oh, 200px);
  background: linear-gradient(180deg, rgba(16,22,50,.98), rgba(7,10,24,.99)); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(255,255,255,.08), 0 40px 80px -20px #000, 0 0 60px -20px rgba(60,230,200,.4);
  transition: left .5s cubic-bezier(.2,.9,.2,1), top .5s cubic-bezier(.2,.9,.2,1), width .5s cubic-bezier(.2,.9,.2,1), height .5s cubic-bezier(.2,.9,.2,1), border-radius .5s; }
#chartPanel.open .ch-scrim { opacity: 1; }
#chartPanel.open .ch { left: 12px; width: calc(100% - 24px); top: max(12px, calc(100% - 484px - env(safe-area-inset-bottom, 0px))); height: 472px; border-radius: 30px; }
@media (min-width: 580px) { #chartPanel.open .ch { left: calc(50% - 270px); width: 540px; } }
.ch-in { width: min(calc(100vw - 24px), 540px); padding: 18px 18px 14px; opacity: 0; transition: opacity .2s; }
#chartPanel.open .ch-in { opacity: 1; transition: opacity .35s .28s; }
.ch-head { display: flex; align-items: baseline; gap: 10px; }
.ch-name { font: 600 22px var(--serif); letter-spacing: -.02em; }
.ch-sym { font: 500 10.5px var(--mono); color: var(--mute); letter-spacing: .1em; }
.ch-x { margin-left: auto; align-self: flex-start; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.07); color: var(--ink2); }
.ch-price { margin-top: 10px; font: 600 38px/1 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ch-chg { margin-top: 6px; font: 600 12px var(--mono); color: var(--up); }
.ch-chg.dn { color: var(--down); } .ch-chg span { color: var(--mute); margin-left: 4px; } .ch-chg .ch-time { color: var(--ink2); margin: 0; }
.ch-assets { display: flex; gap: 18px; margin-top: 14px; }

function importanceOf(s, tab, ctx) {

/* ---------- Bias meter: every recent call on a market combined into one reading ---------- */
// Each Forex story from the last 12 hours (and each calendar release the model called) votes for up or down,
// weighted by its confidence, how important it is, and how recent it is (a 6-hour-old call counts half).
// The strength (1-10) is how much they agree times how confident they are on average.
const BIAS_HOURS = { d1: 12, d3: 24, w1: 48 }; // longer time frames look back further

function biasOf(k, now) {

    if (!top || w > top.w) top = { w, v, ref };

  for (const s of data?.stories || []) if (callsOf(s.fx)[k] && visible(s)) add(callsOf(s.fx)[k].dir, callsOf(s.fx)[k].conf, Math.min(s.published, s.firstSeen), s.fx.impact, s.id);
  if ((prefs.hz || 'd1') === 'd1') for (const e of data?.calendar?.events || []) if (e.model?.assets?.[k]) add(e.model.assets[k].dir, e.model.assets[k].conf, Date.parse(e.time), e.impact === 'high' ? 'high' : 'medium', null);

}

/* ---------- Actions ---------- */
function toggleSave(id) {
  const s = findStory(id); if (!s) return;
  if (isSaved(id)) { prefs.saved = prefs.saved.filter(x => x.id !== id); toast('Removed from saved'); }
  else {
    const { id: sid, title, link, outlet, summary, published, firstSeen, updatedAt, categories, score, tier, breaking, sources, fx, image } = s;
    prefs.saved = [{ id: sid, title, link, outlet, summary, published, firstSeen, updatedAt, categories, score, tier, breaking: false, sources: sources || [], fx, image, why: s.why || [] }, ...prefs.saved].slice(0, 200);
    toast('Saved for later');
  }
  save(); render();
}
document.addEventListener('click', e => {
  if (e.target.closest('#chartPanel')) return;
  const mk = e.target.closest('[data-chart]');
  if (mk) { openChart(mk.dataset.chart, mk.closest('.prism') || mk); return; }
  const pk = e.target.closest('[data-pick]');
  if (pk) { prefs.pick = pk.dataset.pick; save(); sparkN = 400; const el = $('prism'); if (el) el.outerHTML = prismHTML(); return; }
  const link = e.target.closest('a[href^="http"]');
  if (link) { const host = link.closest('[data-id]'); if (host) markRead(host.dataset.id); else if (pvId && link.closest('#sheet')) markRead(pvId); }
  const tab = e.target.closest('.tab');
  if (tab) { animateNext = true; prefs.tab = tab.dataset.tab; view = 'feed'; shown = PAGE; $('searchBar').hidden = true; save(); render(); scrollToTabs(); return; }
  if (e.target.closest('#nextBtn')) { prefs.calOpen = !prefs.calOpen; save(); render(); return; }
  if (e.target.closest('#calTog')) { prefs.calAll = !prefs.calAll; save(); render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id || el.closest('[data-id]')?.dataset.id, outlet = el.dataset.outlet;
  if (act === 'toggle') { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
  else if (act === 'menu') storyMenu(id);
  else if (act === 'preview') previewSheet(id);
  else if (act === 'ai') previewSheet(id, true);
  else if (act === 'hz') { prefs.hz = el.dataset.hz; save(); render(); }
  else if (act === 'wrongtab') wrongTabSheet(id);
  else if (act === 'fixtab') fixTab(id, el.dataset.to);
  else if (act === 'pvsave') { toggleSave(id); const st = findStory(id); $('sheetBody').innerHTML = previewHTML(st); if (st?.fx?.ai) fillAI(st); }
  else if (act === 'close') closeSheet();
  else if (act === 'share') {
    const st = findStory(id); if (!st) return;
    if (navigator.share) navigator.share({ title: st.title, url: st.link }).catch(() => {});
    else if (navigator.clipboard?.writeText) navigator.clipboard.writeText(st.link).then(() => toast('Link copied'), () => toast("Couldn't copy the link"));
  }
  else if (act === 'save') { toggleSave(id); if (el.closest('.sheet')) closeSheet(); }
  else if (act === 'reload') load(true);
  else if (act === 'hide') { prefs.hidden = [...prefs.hidden, id].slice(-500); save(); closeSheet(); render(); toast('Story hidden'); }
  else if (act === 'mute') { if (!prefs.muted.includes(outlet)) prefs.muted.push(outlet); prefs.boosted = prefs.boosted.filter(o => o !== outlet); save(); closeSheet(); render(); toast(`${outlet} muted`); }
  else if (act === 'boost') { prefs.boosted = prefs.boosted.includes(outlet) ? prefs.boosted.filter(o => o !== outlet) : [...prefs.boosted, outlet]; save(); closeSheet(); render(); toast(prefs.boosted.includes(outlet) ? `${outlet} prioritized` : `${outlet} back to normal`); }
  else if (act === 'unmute') { prefs.muted = prefs.muted.filter(o => o !== outlet); save(); render(); settingsSheet(); }
  else if (act === 'unboost') { prefs.boosted = prefs.boosted.filter(o => o !== outlet); save(); render(); settingsSheet(); }
  else if (act === 'unhide') { prefs.hidden = []; save(); render(); settingsSheet(); toast('Hidden stories are back'); }
  else if (act === 'copyBackup') {
    const ta = $('backupText');
    const fallback = () => { ta.focus(); ta.select(); toast('Text selected. Tap Copy.'); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => toast('Backup copied'), fallback); else fallback();
  }
  else if (act === 'briefHide') hideBrief();
  else if (act === 'briefShow') { prefs.briefOpen = nyDay(new Date()); save(); renderTop(); }
  else if (act === 'install') { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; closeSheet(); }); } }
  else if (act === 'restore') {
    try {
      const b = JSON.parse($('backupText').value);
      const arr = v => Array.isArray(v) ? v : [];
      prefs.boosted = arr(b.boosted); prefs.muted = arr(b.muted); prefs.hidden = arr(b.hidden); prefs.saved = arr(b.saved).filter(x => x && x.id && x.title && x.link);

  }
});
// After switching tabs, keep your place: if you'd scrolled into the news, stay just under the tab bar
function scrollToTabs() {
  const tabs = $('tabs'), y = tabs.offsetTop;
  window.scrollTo({ top: scrollY > y ? y : scrollY });
  document.querySelector('.tab[aria-selected="true"]')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}
$('fImp').onclick = () => { prefs.important = true; shown = PAGE; save(); render(); };
$('fAll').onclick = () => { prefs.important = false; shown = PAGE; save(); render(); };
$('more').onclick = () => { shown += PAGE; render(); };
$('btnSettings').onclick = settingsSheet;
$('btnSaved').onclick = () => { animateNext = true; view = view === 'saved' ? 'feed' : 'saved'; $('searchBar').hidden = true; shown = PAGE; render(); window.scrollTo({ top: 0 }); };
$('btnSearch').onclick = () => {
  if (view === 'search') { view = 'feed'; $('searchBar').hidden = true; render(); return; }
  view = 'search'; shown = PAGE; $('searchBar').hidden = false; render(); $('q').focus();
};
$('qClose').onclick = () => { view = 'feed'; query = ''; $('q').value = ''; $('searchBar').hidden = true; render(); };
let qTimer;
$('q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = e.target.value.trim(); shown = PAGE; render(); }, 180); });
// Refresh: fetch the newest news, the older stories and the charts right now (the robot itself checks every few minutes)
let refreshing = false;
async function refreshNow() {
  if (refreshing) return;
  refreshing = true; $('btnRefresh').classList.add('spin');
  olderAt = 0;
  try { await load(true); } finally { refreshing = false; $('btnRefresh').classList.remove('spin'); }
}
$('live').addEventListener('click', refreshNow);
$('btnRefresh').addEventListener('click', refreshNow);
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeChart(); } });

/* ---------- Swipes that follow your finger: tabs on the feed, stories in the story card ---------- */
const EASE_OUT = 'cubic-bezier(.2,.8,.2,1)';
function slide(target, d, commit) {
  const W = Math.min(window.innerWidth, 640);
  target.style.transition = 'transform .17s cubic-bezier(.4,0,1,1), opacity .17s linear';
  target.style.transform = `translate3d(${-d * W * 0.6}px,0,0)`;
  target.style.opacity = '0';

    target.style.opacity = '0';
    void target.offsetWidth;
    target.style.transition = `transform .34s ${EASE_OUT}, opacity .26s ease-out`;
    target.style.transform = 'translate3d(0,0,0)';
    target.style.opacity = '1';

}

const tabIndex = () => TABS.findIndex(t => t.id === prefs.tab);
const canTab = d => view === 'feed' && tabIndex() + d >= 0 && tabIndex() + d < TABS.length && !$('sheet').classList.contains('open') && $('chartPanel').hidden;
function commitTab(d) { prefs.tab = TABS[tabIndex() + d].id; shown = PAGE; animateNext = false; save(); render(); scrollToTabs(); }
// Swiping sideways on the news switches tabs (not on the poster row or the market stage, which scroll or tap themselves)
dragSwipe(document.querySelector('main'), () => document.querySelector('main'), canTab, commitTab, e => !e.target.closest('textarea, input, .posters, .prism'));

const pvIndex = () => currentList.indexOf(pvId);
const canStory = d => $('sheet').classList.contains('float') && $('sheet').classList.contains('open') && pvIndex() >= 0 && pvIndex() + d >= 0 && pvIndex() + d < currentList.length;
function commitStory(d) { pvId = currentList[pvIndex() + d]; markRead(pvId); const st = findStory(pvId); $('sheetBody').innerHTML = previewHTML(st); $('sheet').scrollTop = 0; if (st?.fx?.ai) fillAI(st); }
function stepPreview(d) { if (canStory(d)) slide($('sheetBody'), d, commitStory); }
dragSwipe($('sheet'), () => $('sheetBody'), canStory, commitStory);
document.addEventListener('keydown', e => { if (!$('sheet').classList.contains('float') || !$('sheet').classList.contains('open')) return; if (e.key === 'ArrowRight') stepPreview(1); if (e.key === 'ArrowLeft') stepPreview(-1); });

/* ---------- Read tracking: stories you've opened get dimmed ---------- */
prefs.read = Array.isArray(prefs.read) ? prefs.read : [];
const readSet = new Set(prefs.read);
function markRead(id) {
  if (!id || readSet.has(id)) return;
  readSet.add(id); prefs.read = [...readSet].slice(-1000); save();
  document.querySelectorAll(`.mw[data-id="${id}"]`).forEach(el => el.classList.add('read'));
}

let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

setInterval(() => { if (!document.hidden) load(); }, 2 * 60e3);
setInterval(() => { renderHeader(); const el = $('sess'); if (el && view === 'feed' && prefs.tab === 'forex') el.outerHTML = sessionsHTML(); }, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); checkVersion(); pollLive().then(liveLoop); } });
addEventListener('resize', () => { mastKey = ''; if (data) renderMast(view === 'feed' ? storiesFor(prefs.tab, prefs.important).length : null); });
render();
load();
checkVersion();
preloadHeroes();
pollLive().then(liveLoop);
